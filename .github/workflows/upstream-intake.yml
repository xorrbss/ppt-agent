name: Upstream main intake

on:
  pull_request:
    paths:
      - "compatibility/upstream-intake-policy.json"
      - "compatibility/upstream-compatibility.json"
      - "compatibility/migration-translation-ledger.json"
      - "compatibility/protected-local-patches.json"
      - "compatibility/README.md"
      - "scripts/intake-upstream-main.mjs"
      - "scripts/intake-upstream-main.test.mjs"
      - "scripts/fixtures/upstream-intake/**"
      - "scripts/verify-upstream-compatibility.mjs"
      - ".github/workflows/upstream-intake.yml"
      - ".github/workflows/README.md"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact task revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Use pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.17.1"
      - name: Verify offline intake error and delta contracts
        run: node --test scripts/intake-upstream-main.test.mjs
      - name: Verify pinned local compatibility contract
        run: node scripts/verify-upstream-compatibility.mjs

  live-intake:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact task revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Use pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.17.1"
      - name: Inspect official upstream main
        id: intake
        shell: bash
        env:
          UPSTREAM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p reports
          set +e
          node scripts/intake-upstream-main.mjs \
            --json \
            --output reports/upstream-intake.md \
            --summary "$GITHUB_STEP_SUMMARY" \
            --fail-on-risk \
            > reports/upstream-intake.json
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Retain full intake evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-intake-${{ github.run_id }}
          path: reports/upstream-intake.*
          if-no-files-found: error
          retention-days: 14
      - name: Enforce intake decision
        if: always()
        shell: bash
        env:
          INTAKE_CODE: ${{ steps.intake.outputs.code }}
        run: |
          case "$INTAKE_CODE" in
            0) exit 0 ;;
            1|2) exit "$INTAKE_CODE" ;;
            *) echo "Unexpected or missing intake exit code: $INTAKE_CODE" >&2; exit 70 ;;
          esac
