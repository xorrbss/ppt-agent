name: Upload Release to R2

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to synchronize
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-release-to-r2-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: sync_r2
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$RELEASE_TAG" \
            --dir assets \
            --pattern '*.deb' \
            --pattern '*.dmg' \
            --pattern '*.exe' \
            --pattern '*.appx' \
            --pattern 'SHA256SUMS*.txt'
          echo "Downloaded files:"
          ls -lh assets/

      - name: Resolve release version
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#electron-v}"
          if [ "$VERSION" = "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "Could not resolve a version from release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "Resolved version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Validate R2 credentials
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in R2_ACCESS_KEY R2_SECRET_KEY R2_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required sync_r2 environment secret: $name" >&2
              exit 1
            fi
          done

      - name: Configure R2
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY }}
          secret_access_key = ${{ secrets.R2_SECRET_KEY }}
          endpoint = https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          EOF

      - name: Upload files to R2
        run: |
          rclone copy assets "r2:presenton-desktop/${VERSION}" --progress --transfers=8
