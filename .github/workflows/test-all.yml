name: Test All Applications

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-fastapi:
    name: Test Main FastAPI (locked + system + binary)
    runs-on: ubuntu-latest
    env:
      APP_DATA_DIRECTORY: /tmp/presenton-app-data
      TEMP_DIRECTORY: /tmp/presenton-temp
      USER_CONFIG_PATH: /tmp/presenton-app-data/userConfig.json
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      DISABLE_ANONYMOUS_TRACKING: "true"
      DISABLE_IMAGE_GENERATION: "true"
    
    defaults:
      run:
        working-directory: ./servers/fastapi
    
    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    
    - name: Install uv (with Python 3.11)
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        python-version: "3.11"
        working-directory: servers/fastapi
        enable-cache: true
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libreoffice \
          fontconfig \
          chromium \
          chromium-driver \
          imagemagick
    
    - name: Install locked Python dependencies
      run: uv sync --frozen

    - name: Prepare runtime directories
      run: uv run python -c "from pathlib import Path; import os; [Path(os.environ[key]).mkdir(parents=True, exist_ok=True) for key in ('APP_DATA_DIRECTORY', 'TEMP_DIRECTORY')]"

    - name: Run FastAPI pytest suite (including authored catalogue)
      run: uv run pytest -q --no-header

    - name: Build FastAPI binary
      run: uv run --with pyinstaller python -m PyInstaller server.spec

  test-nextjs:
    name: Test Main Next.js
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./servers/nextjs
    
    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    
    - name: Set up Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: servers/nextjs/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Validate local parity entrypoint mapping
      working-directory: .
      run: node scripts/test-local.mjs --dry-run --all

    - name: Run shared Next.js CI Node suite
      working-directory: .
      run: npm run test:next-ci

    - name: Type-check all Next.js TypeScript sources
      run: npx tsc --noEmit -p tsconfig.json

    - name: Lint application
      run: npm run lint

    - name: Build application
      env:
        NEXT_PUBLIC_FAST_API: http://localhost:8000
        NEXT_PUBLIC_URL: http://localhost:3000
      run: npm run build
    
    # Gate on the component tests that run under the framework:react+webpack
    # config: AdaptiveBlockControls (P4b click->store round-trip) and UploadPage
    # (fork upload surface: controls, slides select, file attach + toasts,
    # validation). Both avoid cypress 14's next-adapter, which is broken on Next 16.
    # The official action handles Xvfb + Linux Electron deps; npm ci already
    # installed the binary, so install: false.
    - name: Cypress component tests (gate — adaptive editor + theme + upload)
      uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7.4.1
      with:
        working-directory: servers/nextjs
        component: true
        spec: "**/AdaptiveBlockControls.cy.tsx,**/AdaptivePropertyControls.cy.tsx,**/ChartLeaf.cy.tsx,**/Variants.cy.tsx,**/UploadPage.cy.tsx,**/ThemeComposer.cy.tsx,**/TemplateSelection.cy.tsx,**/presentationGenUpload.cy.ts,**/presentation-generation.cy.ts,**/api/authored.cy.ts,**/usePresentationGeneration.cy.tsx,**/PresentationHeader.cy.tsx,**/TemplateV2Studio.cy.tsx,**/TemplateV2PptxImportPanel.cy.tsx,**/TemplateV2ChartCopilotPanel.cy.tsx,**/TemplateV2TableEditorPanel.cy.tsx,**/TemplateV2QualityInspector.cy.tsx,**/TemplateV2ImageReplacementPanel.cy.tsx"
        install: false

