name: Test All Applications

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-fastapi:
    name: Test Main FastAPI
    runs-on: ubuntu-latest
    env:
      # runner.temp stays writable when this job is moved to a Windows runner.
      APP_DATA_DIRECTORY: ${{ runner.temp }}/presenton-app-data
      TEMP_DIRECTORY: ${{ runner.temp }}/presenton-temp
      USER_CONFIG_PATH: ${{ runner.temp }}/presenton-app-data/userConfig.json
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      DISABLE_ANONYMOUS_TRACKING: "true"
      DISABLE_IMAGE_GENERATION: "true"
    
    defaults:
      run:
        working-directory: ./servers/fastapi
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libreoffice \
          fontconfig \
          chromium \
          chromium-driver \
          imagemagick
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Install package in editable mode if pyproject.toml exists, otherwise install dependencies directly
        if [ -f "pyproject.toml" ]; then
          pip install -e .
        else
          pip install aiohttp aiomysql aiosqlite asyncpg fastapi[standard] \
            pathvalidate pdfplumber chromadb sqlmodel \
            anthropic google-genai openai fastmcp dirtyjson
        fi
        python -m pip install pytest

    - name: Prepare runtime directories
      run: |
        python -c "from pathlib import Path; import os; [Path(os.environ[key]).mkdir(parents=True, exist_ok=True) for key in ('APP_DATA_DIRECTORY', 'TEMP_DIRECTORY')]"

    - name: Run FastAPI pytest suite (including authored catalogue)
      run: python -m pytest -q --no-header

    - name: Build FastAPI binary
      run: |
        python -m pip install pyinstaller
        pyinstaller server.spec

  test-nextjs:
    name: Test Main Next.js
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./servers/nextjs
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: servers/nextjs/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run ppt-agent CLI mock regression
      working-directory: .
      run: node --test scripts/ppt-agent.test.mjs

    - name: Run adaptive block-edit unit tests
      run: node --experimental-strip-types lib/adaptiveBlockEdit.test.mjs

    - name: Run composeStyledTheme unit test
      run: node --experimental-strip-types "app/(presentation-generator)/presentation/utils/composeStyledTheme.test.mjs"

    - name: Build application
      env:
        NEXT_PUBLIC_FAST_API: http://localhost:8000
        NEXT_PUBLIC_URL: http://localhost:3000
      run: npm run build
    
    # Gate on the component tests that run under the framework:react+webpack
    # config: AdaptiveBlockControls (P4b click->store round-trip) and UploadPage
    # (fork upload surface: controls, slides select, file attach + toasts,
    # validation). Both avoid cypress 14's next-adapter, which is broken on Next 16.
    # The official action handles Xvfb + Linux Electron deps; npm ci already
    # installed the binary, so install: false.
    - name: Cypress component tests (gate — adaptive editor + theme + upload)
      uses: cypress-io/github-action@v7
      with:
        working-directory: servers/nextjs
        component: true
        spec: "**/AdaptiveBlockControls.cy.tsx,**/AdaptivePropertyControls.cy.tsx,**/ChartLeaf.cy.tsx,**/Variants.cy.tsx,**/UploadPage.cy.tsx,**/ThemeComposer.cy.tsx,**/TemplateSelection.cy.tsx,**/presentationGenUpload.cy.ts,**/presentation-generation.cy.ts"
        install: false

