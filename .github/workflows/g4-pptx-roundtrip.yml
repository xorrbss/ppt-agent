# Release gates: the pinned production export-runtime contract plus the Windows
# export/authored-hybrid contracts.
#
# The adaptive-deck PPTX byte round-trip that gave this workflow its "G4" name
# was removed here: it exercised the `legacy`/`adaptive` generation strategies,
# which were retired in b11a92e62 ("refactor: remove legacy presentation
# sources") along with the scripts it ran
# (scripts/check_adaptive_pptx_roundtrip.py, scripts/check_legacy_pptx_roundtrip.py).
# Only `authored` generation remains; there is no equivalent round-trip check
# for it in this workflow today.
#
# The macOS/Windows desktop packaging, signing, notarization, and install-smoke
# jobs were removed with the Electron shell; this fork ships the web/Docker
# runtimes only, so there is no installer left to build or verify.
name: G4 round-trip and release gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-export-runtime:
    name: production export runtime stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build production export runtime
        run: docker build --target assets-builder --tag presenton-export-runtime-gate .

      - name: Verify production export runtime
        run: |
          docker run --rm presenton-export-runtime-gate sh -lc '
            node /app/scripts/sync-presentation-export.cjs --check-only &&
            node --check /app/presentation-export/index.cjs &&
            test -x /app/presentation-export/py/convert-linux-x64
          '

  windows-release-gate:
    name: Windows export runtime and authored-hybrid gate
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            servers/nextjs/package-lock.json

      - name: Install Node.js dependencies
        run: |
          npm ci
          npm ci --prefix servers/nextjs

      - name: Test v0.4.8 export runtime synchronization
        run: npm run test:presentation-export-sync

      - name: Test authored-hybrid export contracts
        working-directory: servers/nextjs
        run: >
          node --experimental-strip-types --test
          lib/authored-hybrid/mode.test.mjs
          lib/authored-hybrid/pptx-archive.test.mjs
          lib/authored-hybrid/cleanup.test.mjs
