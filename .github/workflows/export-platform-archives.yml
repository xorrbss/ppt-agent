name: Presentation export platform archive ABI gate

on:
  pull_request:
    paths:
      - "compatibility/presentation-export-v0.4.8-release-receipt.json"
      - "compatibility/presentation-export-v0.4.8-platform-receipt.json"
      - "scripts/compatibility/verify-export-platform-archives.mjs"
      - "scripts/compatibility/verify-export-platform-archives.test.mjs"
      - ".github/workflows/export-platform-archives.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-abi:
    name: ${{ matrix.os }} archive SHA-256 + ABI
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Test archive verifier contracts
        run: node --test scripts/compatibility/verify-export-platform-archives.test.mjs

      - name: Download and verify all release archives (static ABI)
        if: runner.os != 'Windows'
        run: node scripts/compatibility/verify-export-platform-archives.mjs

      - name: Download, verify, and probe Windows ia32 process startup
        if: runner.os == 'Windows'
        run: node scripts/compatibility/verify-export-platform-archives.mjs --probe-windows-ia32
