# Supply-chain gate for the runtimes this fork ships (Docker/web).
#
# The Electron packaging matrix, its SHA-256 manifest, the quarantined installer
# artifacts, and the downstream ClamAV scan were removed with the desktop shell:
# there is no installer to build, hash, quarantine, or scan any more. What
# remains is the part that never depended on packaging -- auditing the locked
# production dependency trees that the shipped images are built from.
name: Cross-platform dependency audit gate

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "servers/fastapi/**"
      - "servers/nextjs/**"
      - "presentation-export/**"
      - "scripts/sync-presentation-export.cjs"
      - ".github/workflows/cross-platform-packaging-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Locked production dependency audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
    env:
      CYPRESS_INSTALL_BINARY: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            servers/nextjs/package-lock.json

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
          working-directory: servers/fastapi

      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix servers/nextjs
          uv sync --frozen --directory servers/fastapi

      - name: Gate shipped production dependencies
        run: |
          npm audit --omit=dev --audit-level=info
          npm audit --omit=dev --audit-level=info --prefix servers/nextjs

      # Python counterpart of the npm audit above: audit exactly the locked,
      # non-dev FastAPI tree that the shipped image installs. Any known
      # vulnerability fails (same "info" severity floor as npm audit), and
      # --strict also fails when a dependency cannot be audited instead of
      # skipping it. pip-audit itself is pinned to an exact version, like every
      # other input in this hardening gate, so the tool that decides pass/fail
      # cannot silently change under us.
      - name: Audit locked FastAPI production dependencies
        working-directory: servers/fastapi
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes \
            --format requirements-txt --output-file requirements-audit.txt
          uvx pip-audit==2.10.1 --strict --desc on --no-deps --requirement requirements-audit.txt
