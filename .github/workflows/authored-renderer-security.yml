name: Authored renderer security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-isolation-release-gate:
    name: disposable isolation release gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install locked Electron runtime
        run: npm ci --prefix electron

      - name: Install disposable Electron display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1

      - name: Run host-safe renderer contract tests
        run: |
          python contracts/authored-renderer/verify_contract.py
          python -m unittest discover \
            -s docs/experiments/authored-vnext/04-renderer-security/ci \
            -p "test_*.py" -v
          node docs/experiments/authored-vnext/04-renderer-security/tests/verify-corpus.mjs
          npm run test:authored-renderer-isolation --prefix electron

      - name: Observe real Electron renderer PID and security state
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/authored-renderer-security"
          set +e
          node electron/scripts/authored-renderer-runtime-probe.cjs \
            --build-packaged \
            --package-output "$RUNNER_TEMP/authored-renderer-probe-package" \
            --manifest "$RUNNER_TEMP/authored-renderer-security/electron-package.json"
          package_code=$?
          if test "$package_code" = "0"; then
            executable=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["executable"])' \
              "$RUNNER_TEMP/authored-renderer-security/electron-package.json")
            timeout --signal=TERM --kill-after=5s 45s \
              xvfb-run -a --server-args="-screen 0 1280x720x24 -nolisten tcp" \
              "$executable" \
              --output "$RUNNER_TEMP/authored-renderer-security/electron-observation.json"
            code=$?
          else
            code=$package_code
          fi
          python - "$RUNNER_TEMP/authored-renderer-security/electron-observation.json" "$code" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          code = int(sys.argv[2])
          if path.exists():
              value = json.loads(path.read_text(encoding="utf-8"))
          else:
              value = {
                  "schema_version": "authored-electron-security-observation/v1",
                  "run_id": "electron-observation-missing",
                  "controls": {},
                  "observer_errors": [],
              }
          if code != 0:
              value.setdefault("observer_errors", []).append(f"electron-probe-exit-{code}")
          path.write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")
          PY
          exit 0

      - name: Run no-volume disposable container and promotion gate
        id: dynamic-gate
        shell: bash
        env:
          AUTHORED_VNEXT_RENDERER_ENABLED: "true"
        run: |
          set +e
          python contracts/authored-renderer/run_dynamic_gate.py \
            --output-dir "$RUNNER_TEMP/authored-renderer-security" \
            --electron-observation "$RUNNER_TEMP/authored-renderer-security/electron-observation.json" \
            --electron-package-manifest "$RUNNER_TEMP/authored-renderer-security/electron-package.json" \
            --source-revision "$GITHUB_SHA"
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/authored-renderer-security/gate-exit-code.txt"
          if test ! -f "$RUNNER_TEMP/authored-renderer-security/gate-result.json"; then
            python docs/experiments/authored-vnext/04-renderer-security/ci/security_gate.py \
              --input docs/experiments/authored-vnext/05-renderer-isolation-implementation/results/docker-unavailable-observation.json \
              --output-dir "$RUNNER_TEMP/authored-renderer-security" || true
          fi
          exit 0

      - name: Upload JSON JUnit SARIF and raw observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authored-renderer-security-${{ github.sha }}
          path: ${{ runner.temp }}/authored-renderer-security
          if-no-files-found: error
          retention-days: 30

      - name: Enforce fail-closed promotion result
        if: always()
        shell: bash
        run: |
          result="$RUNNER_TEMP/authored-renderer-security/gate-result.json"
          code_file="$RUNNER_TEMP/authored-renderer-security/gate-exit-code.txt"
          test -f "$result" && test -f "$code_file"
          test "$(cat "$code_file")" = "0"
          python - "$result" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          if result.get("status") != "PASS" or result.get("promotion_allowed") is not True:
              raise SystemExit("authored renderer promotion gate did not PASS")
          PY
