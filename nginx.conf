user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types; # Required for SVG mime type
  default_type application/octet-stream; # Required for SVG mime type
  # Application limits remain lower/configurable; this is the non-bypassable
  # reverse-proxy ceiling plus multipart framing headroom.
  client_max_body_size 520M;

  # nginx `add_header` is not inherited into a location that declares its own
  # add_header, so the per-location Cache-Control values are computed here and
  # every header is declared exactly once at server level. An empty map value
  # means "do not add the header".
  map $uri $presenton_cache_control {
    default "";
    ~^/static/ "public, immutable";
    ~^/app_data/(images|exports|uploads|fonts|pptx-to-html)/ "private, max-age=31536000";
  }

  # This server listens on plain HTTP inside the container. HSTS is only
  # meaningful (and only safe) once a TLS terminator sits in front of it, so it
  # is sent solely when that proxy reports the original scheme as https.
  map $http_x_forwarded_proto $presenton_hsts {
    default "";
    https "max-age=31536000; includeSubDomains";
  }

  server {
    listen 80;
    server_name localhost;

    # Application security headers (applied to every location, see the maps
    # above). Upstream copies are hidden so browsers never see duplicates.
    # Frame embedding stays SAMEORIGIN: slide previews render in same-origin
    # sandboxed iframes and public share pages (/p/) may be embedded.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security $presenton_hsts always;
    add_header Cache-Control $presenton_cache_control always;

    location / {
      proxy_pass http://localhost:3000;
      proxy_http_version 1.1; # Required for WebSocket
      proxy_set_header Upgrade $http_upgrade; # WebSocket header
      proxy_set_header Connection "upgrade"; # WebSocket header
      # Preserve browser host:port (e.g. localhost:5000). $host strips the port
      # and breaks Next.js redirects / absolute URLs.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_read_timeout 30m;
      proxy_connect_timeout 30m;
    }

    location /api/v1/ {
      proxy_pass http://localhost:8000;
      # Let FastAPI's chunked writers apply the configured byte limits without
      # nginx first buffering a large request body to disk.
      proxy_request_buffering off;
      proxy_read_timeout 30m;
      proxy_send_timeout 30m;
      proxy_connect_timeout 30m;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP has a separate auth subrequest because the app-data check below sends
    # X-Original-URI for per-owner asset authorization. Sending /mcp there
    # would correctly fail the asset-path check even for an authenticated user.
    location = /_mcp_auth_check {
      internal;
      proxy_pass http://localhost:8000/api/v1/auth/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Original-URI "";
    }

    # MCP is disabled by default in start.js. When explicitly enabled, both
    # entry paths remain behind the same session/API-key gate as FastAPI.
    location ^~ /mcp/ {
      auth_request /_mcp_auth_check;
      proxy_pass http://localhost:8001/mcp/;
      proxy_read_timeout 30m;
      proxy_connect_timeout 30m;
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
      auth_request /_mcp_auth_check;
      proxy_pass http://localhost:8001/mcp;
      proxy_read_timeout 30m;
      proxy_connect_timeout 30m;
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /docs {
      proxy_pass http://localhost:8000/docs;
      proxy_read_timeout 30m;
      proxy_connect_timeout 30m;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
      proxy_pass http://localhost:8000/openapi.json;
      proxy_read_timeout 30m;
      proxy_connect_timeout 30m;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal auth subrequest used to gate /app_data/* static access behind the
    # FastAPI session cookie. Nginx serves these files directly via `alias` for
    # performance, so auth_request is what keeps them from being public.
    location = /_auth_check {
      internal;
      proxy_pass http://localhost:8000/api/v1/auth/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Authorization $http_authorization;
    }

    # Bundled UI static assets (logos, fonts packaged with the app) are safe to
    # serve unauthenticated; they contain no user data. The trailing slash on
    # the location pattern is required: with a bare `/static`, a request like
    # `/static../server.py` matches this block and `alias` rewrites it to
    # `/app/servers/fastapi/static/../server.py`, which nginx resolves to
    # `/app/servers/fastapi/server.py` — unauthenticated arbitrary read of any
    # file under /app the worker can stat. `/static/` constrains the match so
    # the only path that lands here is one that actually started with the
    # separator.
    location /static/ {
      alias /app/servers/fastapi/static/;
      expires 1y;
    }

    location /app_data/images/ {
      auth_request /_auth_check;
      alias /app_data/images/;
      disable_symlinks on;
      expires 1y;
    }

    location /app_data/exports/ {
      auth_request /_auth_check;
      alias /app_data/exports/;
      disable_symlinks on;
      expires 1y;
    }

    location /app_data/uploads/ {
      auth_request /_auth_check;
      alias /app_data/uploads/;
      disable_symlinks on;
      expires 1y;
    }

    location /app_data/fonts/ {
      auth_request /_auth_check;
      alias /app_data/fonts/;
      disable_symlinks on;
      expires 1y;
    }

    location /app_data/pptx-to-html/ {
      auth_request /_auth_check;
      alias /app_data/pptx-to-html/;
      disable_symlinks on;
      expires 1y;
    }
  }
}
