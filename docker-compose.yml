# Shared environment for all four service variants. Keys used by the app are
# read through servers/fastapi/utils/get_env.py — keep that file, start.js,
# this anchor, and the README env table consistent when adding knobs.
# TEMPLATE_V2_DEPLOYMENT_TIER (a generic deployment-tier knob; see
# servers/fastapi/services/provider_durable_admission.py,
# provider_secure_runtime.py, and provider_transport_security.py) is a
# production-only key set per-service below, not here.
x-presenton-env: &presenton-env
  # Bundled PPTX/PDF export (Puppeteer); matches CI and production image.
  PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
  MIGRATE_DATABASE_ON_STARTUP: "true"
  # Required only when upgrading a populated PostgreSQL database through e7.
  # Leave empty to fail closed until the legacy writer timezone is confirmed.
  PPT_AGENT_ASYNC_TASK_LEGACY_TIMEZONE: ${PPT_AGENT_ASYNC_TASK_LEGACY_TIMEZONE:-}
  PRESENTON_MAX_UPLOAD_MB: ${PRESENTON_MAX_UPLOAD_MB:-100}
  PRESENTON_MAX_UPLOAD_TOTAL_MB: ${PRESENTON_MAX_UPLOAD_TOTAL_MB:-512}
  PRESENTON_MAX_IMAGE_UPLOAD_MB: ${PRESENTON_MAX_IMAGE_UPLOAD_MB:-20}
  # BEGIN GENERATED SETTINGS: compose.shared
  CAN_CHANGE_KEYS: ${CAN_CHANGE_KEYS:-true}
  LLM: ${LLM:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  GOOGLE_MODEL: ${GOOGLE_MODEL:-models/gemini-2.5-flash}
  VERTEX_API_KEY: ${VERTEX_API_KEY:-}
  VERTEX_MODEL: ${VERTEX_MODEL:-gemini-2.5-flash}
  VERTEX_PROJECT: ${VERTEX_PROJECT:-}
  VERTEX_LOCATION: ${VERTEX_LOCATION:-}
  VERTEX_BASE_URL: ${VERTEX_BASE_URL:-}
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
  AZURE_OPENAI_MODEL: ${AZURE_OPENAI_MODEL:-gpt-4.1}
  AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
  AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
  AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
  AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
  BEDROCK_REGION: ${BEDROCK_REGION:-us-east-1}
  BEDROCK_API_KEY: ${BEDROCK_API_KEY:-}
  BEDROCK_AWS_ACCESS_KEY_ID: ${BEDROCK_AWS_ACCESS_KEY_ID:-}
  BEDROCK_AWS_SECRET_ACCESS_KEY: ${BEDROCK_AWS_SECRET_ACCESS_KEY:-}
  BEDROCK_AWS_SESSION_TOKEN: ${BEDROCK_AWS_SESSION_TOKEN:-}
  BEDROCK_PROFILE_NAME: ${BEDROCK_PROFILE_NAME:-}
  BEDROCK_MODEL: ${BEDROCK_MODEL:-us.anthropic.claude-3-5-haiku-20241022-v1:0}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
  FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
  FIREWORKS_MODEL: ${FIREWORKS_MODEL:-accounts/fireworks/models/llama-v3p1-8b-instruct}
  FIREWORKS_BASE_URL: ${FIREWORKS_BASE_URL:-}
  TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
  TOGETHER_MODEL: ${TOGETHER_MODEL:-openai/gpt-oss-20b}
  TOGETHER_BASE_URL: ${TOGETHER_BASE_URL:-}
  CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
  CEREBRAS_MODEL: ${CEREBRAS_MODEL:-llama-3.3-70b}
  CEREBRAS_BASE_URL: ${CEREBRAS_BASE_URL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
  OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-}
  CUSTOM_LLM_URL: ${CUSTOM_LLM_URL:-}
  CUSTOM_LLM_API_KEY: ${CUSTOM_LLM_API_KEY:-}
  CUSTOM_MODEL: ${CUSTOM_MODEL:-}
  LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
  LITELLM_API_KEY: ${LITELLM_API_KEY:-}
  LITELLM_MODEL: ${LITELLM_MODEL:-gpt-4.1}
  LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-}
  LMSTUDIO_API_KEY: ${LMSTUDIO_API_KEY:-}
  LMSTUDIO_MODEL: ${LMSTUDIO_MODEL:-openai/gpt-oss-20b}
  CODEX_MODEL: ${CODEX_MODEL:-gpt-6.1-sol}
  CODEX_REASONING_EFFORT: ${CODEX_REASONING_EFFORT:-}
  DISABLE_THINKING: ${DISABLE_THINKING:-false}
  WEB_GROUNDING: ${WEB_GROUNDING:-false}
  DISABLE_IMAGE_GENERATION: ${DISABLE_IMAGE_GENERATION:-false}
  ENABLE_PARALLEL_IMAGE_GENERATION: ${ENABLE_PARALLEL_IMAGE_GENERATION:-true}
  IMAGE_PROVIDER: ${IMAGE_PROVIDER:-}
  PEXELS_API_KEY: ${PEXELS_API_KEY:-}
  PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
  COMFYUI_URL: ${COMFYUI_URL:-}
  COMFYUI_WORKFLOW: ${COMFYUI_WORKFLOW:-}
  OPEN_WEBUI_IMAGE_URL: ${OPEN_WEBUI_IMAGE_URL:-}
  OPEN_WEBUI_IMAGE_API_KEY: ${OPEN_WEBUI_IMAGE_API_KEY:-}
  OPENAI_COMPAT_IMAGE_BASE_URL: ${OPENAI_COMPAT_IMAGE_BASE_URL:-}
  OPENAI_COMPAT_IMAGE_API_KEY: ${OPENAI_COMPAT_IMAGE_API_KEY:-}
  OPENAI_COMPAT_IMAGE_MODEL: ${OPENAI_COMPAT_IMAGE_MODEL:-}
  DALL_E_3_QUALITY: ${DALL_E_3_QUALITY:-standard}
  GPT_IMAGE_1_5_QUALITY: ${GPT_IMAGE_1_5_QUALITY:-medium}
  GPT_IMAGE_2_QUALITY: ${GPT_IMAGE_2_QUALITY:-medium}
  GPT_IMAGE_2_5_QUALITY: ${GPT_IMAGE_2_5_QUALITY:-medium}
  WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-auto}
  SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  EXA_API_KEY: ${EXA_API_KEY:-}
  BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
  OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
  # END GENERATED SETTINGS: compose.shared
  # Ollama is not baked into the image; set START_OLLAMA=true for runtime install, or use OLLAMA_URL.
  START_OLLAMA: ${START_OLLAMA:-false}
  DISABLE_GOOGLE_FONTS_COLLECTION: ${DISABLE_GOOGLE_FONTS_COLLECTION}
  DATABASE_URL: ${DATABASE_URL}
  # Chat-first remains fail-closed in the stock deployment.  The frontend
  # switch is also supplied as a build ARG below because Next embeds it.
  # Roll back without schema rollback: set both flags to false and recreate.
  CHAT_FIRST_WORKSPACE_ENABLED: ${CHAT_FIRST_WORKSPACE_ENABLED:-false}
  CHAT_FIRST_WORKSPACE_RUNTIME_PROFILE: ${CHAT_FIRST_WORKSPACE_RUNTIME_PROFILE:-}
  NEXT_PUBLIC_CHAT_FIRST_WORKBENCH_ENABLED: ${NEXT_PUBLIC_CHAT_FIRST_WORKBENCH_ENABLED:-false}
  # SlideSpec is the default quality-repair path. Set SLIDESPEC_KILL_SWITCH=true
  # for an immediate legacy rollback; the other flags support diagnostics.
  SLIDESPEC_IMPORT_SHADOW: ${SLIDESPEC_IMPORT_SHADOW:-false}
  SLIDESPEC_REPAIR_SHADOW: ${SLIDESPEC_REPAIR_SHADOW:-false}
  SLIDESPEC_REPAIR_CANARY: ${SLIDESPEC_REPAIR_CANARY:-100}
  SLIDESPEC_REPAIR_APPLY: ${SLIDESPEC_REPAIR_APPLY:-true}
  SLIDESPEC_REPAIR_ALL_SLIDES: ${SLIDESPEC_REPAIR_ALL_SLIDES:-true}
  SLIDESPEC_KILL_SWITCH: ${SLIDESPEC_KILL_SWITCH:-false}
  SLIDESPEC_REPAIR_ROLLOUT_SALT: ${SLIDESPEC_REPAIR_ROLLOUT_SALT:-v1}
  NEXT_PUBLIC_SLIDESPEC_REPAIR_CANARY_UI: ${NEXT_PUBLIC_SLIDESPEC_REPAIR_CANARY_UI:-true}
  NEXT_PUBLIC_SLIDESPEC_REPAIR_ALL_SLIDES: ${NEXT_PUBLIC_SLIDESPEC_REPAIR_ALL_SLIDES:-true}
  # Do not enable this on the stock image: it does not ship a malware scanner
  # or trusted signature-definition update strategy.
  WORKSPACE_ASSET_MALWARE_SCAN_MODE: ${WORKSPACE_ASSET_MALWARE_SCAN_MODE:-disabled}
  WORKSPACE_ASSET_MALWARE_SCANNER: ${WORKSPACE_ASSET_MALWARE_SCANNER:-}
  # Anonymous telemetry is off by default for this fork; set to "false" to opt in.
  DISABLE_ANONYMOUS_TRACKING: ${DISABLE_ANONYMOUS_TRACKING:-true}
  MEM0_LLM_MODEL: ${MEM0_LLM_MODEL:-${OLLAMA_MODEL:-llama3.1:latest}}
  MEM0_LLM_API_KEY: ${MEM0_LLM_API_KEY:-ollama}
  MEM0_LLM_BASE_URL: ${MEM0_LLM_BASE_URL:-${OLLAMA_URL:-http://host.docker.internal:11434}}
  MEM0_ENABLED: ${MEM0_ENABLED:-true}
  MEM0_DIR: ${MEM0_DIR:-/app_data/mem0}
  MEM0_EMBEDDER_PROVIDER: ${MEM0_EMBEDDER_PROVIDER:-fastembed}
  MEM0_EMBEDDER_MODEL: ${MEM0_EMBEDDER_MODEL:-BAAI/bge-small-en-v1.5}
  MEM0_EMBEDDING_DIMS: ${MEM0_EMBEDDING_DIMS:-384}
  MEM0_SPACY_MODEL: ${MEM0_SPACY_MODEL:-en_core_web_sm}
  MEM0_REQUIRE_SPACY_MODEL: ${MEM0_REQUIRE_SPACY_MODEL:-true}
  LITEPARSE_DPI: ${LITEPARSE_DPI:-120}
  LITEPARSE_NUM_WORKERS: ${LITEPARSE_NUM_WORKERS:-1}
  AUTH_USERNAME: ${AUTH_USERNAME:-}
  AUTH_PASSWORD: ${AUTH_PASSWORD:-}
  AUTH_OVERRIDE_FROM_ENV: ${AUTH_OVERRIDE_FROM_ENV:-}
  RESET_AUTH: ${RESET_AUTH:-}

services:
  production:
    # image: ghcr.io/presenton/presenton:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CHAT_FIRST_WORKBENCH_ENABLED: ${NEXT_PUBLIC_CHAT_FIRST_WORKBENCH_ENABLED:-false}
        NEXT_PUBLIC_SLIDESPEC_REPAIR_CANARY_UI: ${NEXT_PUBLIC_SLIDESPEC_REPAIR_CANARY_UI:-true}
        NEXT_PUBLIC_SLIDESPEC_REPAIR_ALL_SLIDES: ${NEXT_PUBLIC_SLIDESPEC_REPAIR_ALL_SLIDES:-true}
    # nginx only proxies /api/v1/* to FastAPI; everything else (including
    # /api/health) goes to Next.js (see nginx.conf), so this reaches
    # Next.js's own /api/health route through the full nginx front. That
    # route (servers/nextjs/app/api/health/route.ts) makes one short, bounded
    # call to FastAPI's own /health (servers/fastapi/api/health.py) and
    # reflects the result, so this healthcheck also fails when FastAPI is
    # dead or hung, not only when Next.js is.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      # You can replace 5000 with any other port number of your choice to run Presenton on a different port number.
      - "5000:80"
      # Required for Codex OAuth callback (OpenAI redirects browser directly to localhost:1455)
      - "1455:1455"
    volumes:
      - ./app_data:/app_data
      - ./servers/fastapi/templates:/app/servers/fastapi/templates:ro
    environment:
      <<: *presenton-env
      TEMPLATE_V2_DEPLOYMENT_TIER: production
      # Mem0 needs a local embedder/vector-store footprint the stock image
      # does not provision; keep it off in production/production-gpu and let
      # development opt in via the shared default above.
      MEM0_ENABLED: "false"

  production-gpu:
    # image: ghcr.io/presenton/presenton:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CHAT_FIRST_WORKBENCH_ENABLED: ${NEXT_PUBLIC_CHAT_FIRST_WORKBENCH_ENABLED:-false}
        NEXT_PUBLIC_SLIDESPEC_REPAIR_CANARY_UI: ${NEXT_PUBLIC_SLIDESPEC_REPAIR_CANARY_UI:-true}
        NEXT_PUBLIC_SLIDESPEC_REPAIR_ALL_SLIDES: ${NEXT_PUBLIC_SLIDESPEC_REPAIR_ALL_SLIDES:-true}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # See the production healthcheck comment above: this reaches Next.js's
    # own /api/health route, which reflects a bounded FastAPI /health call.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      # You can replace 5000 with any other port number of your choice to run Presenton on a different port number.
      - "5000:80"
      # Required for Codex OAuth callback (OpenAI redirects browser directly to localhost:1455)
      - "1455:1455"
    volumes:
      - ./app_data:/app_data
    environment:
      <<: *presenton-env
      TEMPLATE_V2_DEPLOYMENT_TIER: production
      # Mem0 needs a local embedder/vector-store footprint the stock image
      # does not provision; keep it off in production/production-gpu and let
      # development opt in via the shared default above.
      MEM0_ENABLED: "false"

  development:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # See the production healthcheck comment above: this reaches Next.js's
    # own /api/health route, which reflects a bounded FastAPI /health call.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "5000:80"
      # Required for Codex OAuth callback (OpenAI redirects browser directly to localhost:1455)
      - "1455:1455"
    volumes:
      - .:/app
      - presenton_root_node_modules:/app/node_modules
      - presenton_document_extraction_liteparse:/app/document-extraction-liteparse
      - ./app_data:/app_data
    environment:
      <<: *presenton-env
      TEMPLATE_V2_DEPLOYMENT_TIER: development

  development-gpu:
    build:
      context: .
      dockerfile: Dockerfile.dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # See the production healthcheck comment above: this reaches Next.js's
    # own /api/health route, which reflects a bounded FastAPI /health call.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "5000:80"
      # Required for Codex OAuth callback (OpenAI redirects browser directly to localhost:1455)
      - "1455:1455"
    volumes:
      - .:/app
      - presenton_root_node_modules:/app/node_modules
      - presenton_document_extraction_liteparse:/app/document-extraction-liteparse
      - ./app_data:/app_data
    environment:
      <<: *presenton-env
      TEMPLATE_V2_DEPLOYMENT_TIER: development

  # ---------------------------------------------------------------------------
  # `multi` profile: PostgreSQL + one-shot migration/role provisioning + API +
  # N generation workers, each in its own container.  Additive: the services
  # above are untouched.  Runbook: docs/multi-process-compose-runbook-20260906.md
  #
  #   docker compose --profile multi up --build --scale worker=2
  #
  # Start order, enforced by the depends_on conditions below:
  #   postgres (healthy) -> migrate (exit 0) -> api (healthy) -> worker
  #
  # Only `migrate` runs Alembic.  It connects as the database owner, holds the
  # PostgreSQL advisory lock in servers/fastapi/migrations.py, then creates or
  # normalises the two NOLOGIN groups the migrations grant to
  # (presenton_public_api, presenton_public_controller) and the two logins the
  # runtime uses (presenton_public_api_login, presenton_public_controller_login),
  # re-granting DML on every table so tables added by new migrations are
  # covered.  `api` and `worker` run with MIGRATE_DATABASE_ON_STARTUP=false and
  # ENVIRONMENT=production, so utils/db_utils.py refuses a generic DATABASE_URL
  # and services/database.py verifies at startup that the API login is a
  # member of presenton_public_api (never controller, never superuser or
  # BYPASSRLS) and that every worker login is a member of
  # presenton_public_controller.  Passwords go into a URL: use [A-Za-z0-9_-].
  # ---------------------------------------------------------------------------
  postgres:
    profiles: ["multi"]
    image: ${PRESENTON_MULTI_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${PRESENTON_MULTI_POSTGRES_DB:-presenton}
      # The owner is the migration authority; the image makes it a superuser
      # and refuses to initialise the cluster while the password is empty.
      POSTGRES_USER: ${PRESENTON_MULTI_POSTGRES_USER:-presenton_owner}
      POSTGRES_PASSWORD: ${PRESENTON_MULTI_POSTGRES_PASSWORD:-}
    volumes:
      - presenton_multi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  migrate:
    profiles: ["multi"]
    # The build lives here because this is the first service compose creates;
    # `api` and `worker` reuse the same image tag.
    image: ${PRESENTON_MULTI_IMAGE:-presenton-multi:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CHAT_FIRST_WORKBENCH_ENABLED: ${NEXT_PUBLIC_CHAT_FIRST_WORKBENCH_ENABLED:-false}
        NEXT_PUBLIC_SLIDESPEC_REPAIR_CANARY_UI: ${NEXT_PUBLIC_SLIDESPEC_REPAIR_CANARY_UI:-true}
        NEXT_PUBLIC_SLIDESPEC_REPAIR_ALL_SLIDES: ${NEXT_PUBLIC_SLIDESPEC_REPAIR_ALL_SLIDES:-true}
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/servers/fastapi
    # Upgrades to the Alembic head as the owner, then provisions the roles.
    # Idempotent: every boot re-runs it, a database already at head is a no-op.
    command: ["python", "-m", "scripts.provision_public_v2_local_db_roles"]
    environment:
      # No process role here: without one, db_utils honours DATABASE_URL, and
      # this is the only service that may hold the owner credential.
      DATABASE_URL: postgresql+asyncpg://${PRESENTON_MULTI_POSTGRES_USER:-presenton_owner}:${PRESENTON_MULTI_POSTGRES_PASSWORD:-}@postgres:5432/${PRESENTON_MULTI_POSTGRES_DB:-presenton}
      PUBLIC_V2_LOCAL_API_DB_PASSWORD: ${PRESENTON_MULTI_API_DB_PASSWORD:-}
      PUBLIC_V2_LOCAL_CONTROLLER_DB_PASSWORD: ${PRESENTON_MULTI_CONTROLLER_DB_PASSWORD:-}
      MIGRATE_DATABASE_ON_STARTUP: "true"
      PPT_AGENT_ASYNC_TASK_LEGACY_TIMEZONE: ${PPT_AGENT_ASYNC_TASK_LEGACY_TIMEZONE:-}

  api:
    profiles: ["multi"]
    image: ${PRESENTON_MULTI_IMAGE:-presenton-multi:local}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # See the production healthcheck comment above: this reaches Next.js's
    # own /api/health route, which reflects a bounded FastAPI /health call.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${PRESENTON_MULTI_PORT:-5000}:80"
      # Required for Codex OAuth callback (OpenAI redirects browser directly to localhost:1455)
      - "1455:1455"
    volumes:
      - ./app_data:/app_data
      - ./servers/fastapi/templates:/app/servers/fastapi/templates:ro
    environment:
      <<: *presenton-env
      # `production` here needs a scanner-equipped image (see the canary
      # overlay); the stock image only supports the local tiers.  Durable
      # provider admission is therefore switched on explicitly below.
      TEMPLATE_V2_DEPLOYMENT_TIER: ${PRESENTON_MULTI_DEPLOYMENT_TIER:-development}
      MEM0_ENABLED: "false"
      # Not overridable: a local tier would make db_utils fall back to
      # DATABASE_URL (empty here) and silently start on SQLite.
      ENVIRONMENT: production
      PUBLIC_DATABASE_PROCESS_ROLE: api
      DATABASE_URL: ""
      PUBLIC_API_DATABASE_URL: postgresql+asyncpg://presenton_public_api_login:${PRESENTON_MULTI_API_DB_PASSWORD:-}@postgres:5432/${PRESENTON_MULTI_POSTGRES_DB:-presenton}
      MIGRATE_DATABASE_ON_STARTUP: "false"
      CHAT_FIRST_WORKSPACE_RUNTIME_PROFILE: postgresql-cluster
      # The API only admits commands; every worker container owns the claims.
      WORKSPACE_OPERATION_WORKER_MODE: external
      WORKSPACE_OPERATION_WORKER_LAUNCH: service
      PROVIDER_DURABLE_RUNTIME_REQUIRED: "true"

  worker:
    profiles: ["multi"]
    image: ${PRESENTON_MULTI_IMAGE:-presenton-multi:local}
    depends_on:
      postgres:
        condition: service_healthy
      # A healthy API proves `migrate` completed and userConfig.json exists.
      api:
        condition: service_healthy
    deploy:
      replicas: ${PRESENTON_MULTI_WORKER_REPLICAS:-1}
    working_dir: /app/servers/fastapi
    command: ["python", "-m", "services.workspace_operation_worker"]
    # The worker's loopback metrics listener doubles as its liveness probe.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9464/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ./app_data:/app_data
      - ./servers/fastapi/templates:/app/servers/fastapi/templates:ro
    environment:
      <<: *presenton-env
      TEMPLATE_V2_DEPLOYMENT_TIER: ${PRESENTON_MULTI_DEPLOYMENT_TIER:-development}
      MEM0_ENABLED: "false"
      ENVIRONMENT: production
      PUBLIC_DATABASE_PROCESS_ROLE: controller
      DATABASE_URL: ""
      PUBLIC_CONTROLLER_DATABASE_URL: postgresql+asyncpg://presenton_public_controller_login:${PRESENTON_MULTI_CONTROLLER_DB_PASSWORD:-}@postgres:5432/${PRESENTON_MULTI_POSTGRES_DB:-presenton}
      MIGRATE_DATABASE_ON_STARTUP: "false"
      CHAT_FIRST_WORKSPACE_RUNTIME_PROFILE: postgresql-cluster
      WORKSPACE_OPERATION_WORKER_MODE: external
      # Generation controller profile (services/public_worker_profiles.py):
      # claims presentation.generate and quality.review.
      PPT_PROCESS_PROFILE: generation
      WORKSPACE_OPERATION_EXTERNAL_CONTROLLER: generation
      PROVIDER_DURABLE_RUNTIME_REQUIRED: "true"
      # start.js is not involved here, so the paths it would derive are set
      # explicitly: provider settings seed from the shared app_data volume and
      # slide rendering/export reach Next.js through the api container's nginx.
      USER_CONFIG_PATH: /app_data/userConfig.json
      NEXT_INTERNAL_URL: http://api
      WORKSPACE_OPERATION_METRICS_HOST: 127.0.0.1
      WORKSPACE_OPERATION_METRICS_PORT: "9464"

volumes:
  presenton_root_node_modules:
  presenton_document_extraction_liteparse:
  presenton_multi_postgres_data:
