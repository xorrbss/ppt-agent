image: cypress/included:15.19.0

definitions:
  caches:
    uv: ~/.cache/uv
  steps:
    - step: &nextjs-ci-node-contracts
        name: Run shared Next.js CI Node suite
        size: 2x
        max-time: 15
        script:
          - npm ci
          - npm ci --prefix servers/nextjs
          - npm run test:next-ci
    - step: &upstream-byte-parity-check
        name: Upstream byte-parity verification
        size: 1x
        max-time: 10
        script:
          - npm ci
          - node scripts/verify-upstream-byte-parity.mjs
    - step: &workspace-chat-first-e2e
        name: Workspace chat-first browser E2E
        size: 2x
        max-time: 25
        caches:
          - node
          - uv
        script:
          - apt-get update
          - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-venv
          - python3 -m venv .bitbucket-uv
          - .bitbucket-uv/bin/python -m pip install --disable-pip-version-check uv==0.11.17
          - npm ci --prefix servers/nextjs
          - .bitbucket-uv/bin/uv sync --frozen --directory servers/fastapi
          - .bitbucket-uv/bin/uv run --directory servers/fastapi ruff check .
          - export CI=true
          - export PATH="$BITBUCKET_CLONE_DIR/.bitbucket-uv/bin:$PATH"
          - export WORKSPACE_E2E_ARTIFACT_DIR="$BITBUCKET_CLONE_DIR/test-artifacts/workspace-e2e"
          - cd servers/nextjs
          - xvfb-run -a npm run test:workspace-e2e
        artifacts:
          upload:
            - name: workspace-e2e-diagnostics
              type: scoped
              paths:
                - test-artifacts/workspace-e2e/**
              capture-on: always
    - step: &upstream-intake-monitor
        name: Check upstream main compatibility
        max-time: 10
        trigger: manual
        script:
          - apt-get update && apt-get install -y --no-install-recommends nodejs npm
          - npm ci
          - mkdir -p reports
          - node scripts/intake-upstream-main.mjs \
              --json \
              --output reports/upstream-intake.md \
              --fail-on-risk \
              > reports/upstream-intake.json 2>&1 || true
          - echo "=== Upstream intake report (first 50 lines) ==="
          - cat reports/upstream-intake.json | head -50
        artifacts:
          upload:
            - name: upstream-intake-reports
              type: scoped
              paths:
                - reports/upstream-intake.*
              capture-on: always

pipelines:
  pull-requests:
    "**":
      - step: *nextjs-ci-node-contracts
      - step: *upstream-byte-parity-check
      - step: *workspace-chat-first-e2e
  branches:
    main:
      - step: *nextjs-ci-node-contracts
      - step: *upstream-byte-parity-check
      - step: *workspace-chat-first-e2e
  custom:
    Upstream compatibility check:
      - step: *upstream-intake-monitor
