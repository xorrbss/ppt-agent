image: cypress/included:15.19.0

definitions:
  caches:
    uv: ~/.cache/uv
  steps:
    - step: &authored-release-readiness-config
        name: Authored release readiness configuration
        max-time: 5
        script:
          - node scripts/verify-authored-release-required-checks.mjs
    - step: &nextjs-ci-node-contracts
        name: Run shared Next.js CI Node suite
        size: 2x
        max-time: 15
        script:
          - npm ci
          - npm ci --prefix servers/nextjs
          - npm run test:next-ci
    - step: &dashboard-component-gate
        name: Dashboard component gate
        size: 2x
        max-time: 10
        script:
          - npm ci --prefix servers/nextjs
          - cd servers/nextjs
          - xvfb-run -a npx --no-install cypress run --component --spec "**/DashboardPage.cy.tsx"
    - step: &fastapi-svg-unit-subset
        name: FastAPI svg unit subset
        size: 2x
        max-time: 30
        caches:
          - uv
        script:
          - apt-get update
          - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-venv
          - python3 -m venv .bitbucket-uv
          - .bitbucket-uv/bin/python -m pip install --disable-pip-version-check uv==0.11.17
          - .bitbucket-uv/bin/uv sync --frozen --directory servers/fastapi
          - export DISABLE_IMAGE_GENERATION=true
          - export DATABASE_URL=sqlite+aiosqlite:///./test.db
          - export APP_DATA_DIRECTORY=/tmp/app_data
          - mkdir -p "$APP_DATA_DIRECTORY"
          - cd servers/fastapi
          - ../../.bitbucket-uv/bin/uv run python scripts/svg_unit_subset.py --check
          - ../../.bitbucket-uv/bin/uv run pytest $(cat tests/svg_unit_subset.txt) -n 4 --dist loadfile -q -p no:cacheprovider
    - step: &workspace-chat-first-e2e
        name: Workspace chat-first browser E2E
        size: 2x
        max-time: 25
        caches:
          - node
          - uv
        script:
          - apt-get update
          - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-venv
          - python3 -m venv .bitbucket-uv
          - .bitbucket-uv/bin/python -m pip install --disable-pip-version-check uv==0.11.17
          - npm ci --prefix servers/nextjs
          - .bitbucket-uv/bin/uv sync --frozen --directory servers/fastapi
          - .bitbucket-uv/bin/uv run --directory servers/fastapi ruff check .
          - .bitbucket-uv/bin/uv run --directory servers/fastapi python scripts/check_authored_style_samples.py
          - export CI=true
          - export PATH="$BITBUCKET_CLONE_DIR/.bitbucket-uv/bin:$PATH"
          - export WORKSPACE_E2E_ARTIFACT_DIR="$BITBUCKET_CLONE_DIR/test-artifacts/workspace-e2e"
          - cd servers/nextjs
          - xvfb-run -a npm run test:workspace-e2e
        artifacts:
          upload:
            - name: workspace-e2e-diagnostics
              type: scoped
              paths:
                - test-artifacts/workspace-e2e/**
              capture-on: always

pipelines:
  pull-requests:
    "**":
      - step: *authored-release-readiness-config
      - step: *nextjs-ci-node-contracts
      - step: *dashboard-component-gate
      - step: *fastapi-svg-unit-subset
      - step: *workspace-chat-first-e2e
  branches:
    main:
      - step: *authored-release-readiness-config
      - step: *nextjs-ci-node-contracts
      - step: *dashboard-component-gate
      - step: *fastapi-svg-unit-subset
      - step: *workspace-chat-first-e2e
  custom:
    FastAPI pytest baseline:
      - step:
          name: Collect FastAPI pytest baseline
          size: 2x
          max-time: 40
          caches:
            - node
            - uv
          script:
            - apt-get update
            - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-venv
            - python3 -m venv .bitbucket-uv
            - .bitbucket-uv/bin/python -m pip install --disable-pip-version-check uv==0.11.17
            - npm ci --prefix servers/nextjs
            - .bitbucket-uv/bin/uv sync --frozen --directory servers/fastapi
            - .bitbucket-uv/bin/uv run --frozen --directory servers/fastapi python ../../scripts/collect-fastapi-pytest-baseline.py --output-dir ../../test-artifacts/fastapi-pytest-baseline
          artifacts:
            upload:
              - name: fastapi-pytest-baseline
                type: scoped
                paths:
                  - test-artifacts/fastapi-pytest-baseline/**
                capture-on: always
    Authored release required-check verification:
      - step:
          name: Verify Bitbucket required merge checks
          max-time: 5
          script:
            - node scripts/verify-authored-release-required-checks.mjs --live
