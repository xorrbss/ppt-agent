<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1280, initial-scale=1">
    <style>
      html, body {
        width: 1280px;
        height: 720px;
        margin: 0;
        overflow: hidden;
        font-family: Arial, "Malgun Gothic", sans-serif;
      }
      body { position: relative; background: transparent; }
      .card-backdrop, .card {
        position: absolute;
        left: 80px;
        top: 70px;
        width: 760px;
        height: 380px;
      }
      .card-backdrop {
        border-radius: 24px;
        background: rgb(244, 241, 234);
        box-shadow: 0 18px 50px rgba(20, 25, 35, 0.22);
      }
      h1, p, small { position: absolute; margin: 0; }
      h1 {
        left: 48px;
        top: 42px;
        width: 620px;
        font-size: 40px;
        line-height: 48px;
        color: rgb(22, 31, 54);
      }
      .body-copy {
        left: 48px;
        top: 118px;
        width: 410px;
        font-size: 20px;
        line-height: 30px;
        color: rgb(48, 57, 75);
      }
      .numeric {
        left: 48px;
        top: 225px;
        font-size: 34px;
        line-height: 42px;
        color: rgb(23, 112, 89);
      }
      .caption {
        left: 48px;
        top: 325px;
        font-size: 12px;
        line-height: 16px;
        color: rgb(91, 98, 113);
      }
      .safe-image {
        position: absolute;
        left: 540px;
        top: 190px;
        width: 140px;
        height: 110px;
        object-fit: fill;
      }
      .simple-shape {
        position: absolute;
        left: 400px;
        top: 240px;
        width: 120px;
        height: 44px;
        border-radius: 22px;
        background: rgb(31, 106, 229);
      }
      .fallback-zone {
        position: absolute;
        left: 880px;
        top: 70px;
        width: 330px;
        height: 600px;
        background: rgb(240, 244, 249);
      }
      .fallback-zone p { font-size: 18px; line-height: 24px; color: rgb(28, 40, 58); }
      .filtered { left: 24px; top: 24px; filter: blur(0px); }
      .clipped { left: 24px; top: 72px; clip-path: inset(0); }
      .pseudo { left: 24px; top: 120px; }
      .pseudo::before { content: "★"; color: rgb(219, 71, 72); }
      .overflow-box {
        position: absolute;
        left: 24px;
        top: 170px;
        width: 270px;
        height: 44px;
        overflow: hidden;
      }
      .overflow-box p { position: static; width: 400px; white-space: nowrap; }
      .occluded { left: 24px; top: 245px; }
      .occluder {
        position: absolute;
        left: 20px;
        top: 238px;
        width: 210px;
        height: 35px;
        background: rgb(240, 244, 249);
      }
      table { position: absolute; left: 24px; top: 310px; border-collapse: collapse; }
      td { border: 1px solid rgb(90, 100, 120); padding: 4px 8px; }
      svg { position: absolute; left: 24px; top: 390px; width: 160px; height: 90px; }
      .scaled { left: 24px; top: 515px; transform: scale(1.05); }
      .compound-effects {
        left: 24px;
        top: 548px;
        mask-image: linear-gradient(black, black);
        mix-blend-mode: multiply;
        backdrop-filter: blur(0px);
      }
      .compound-effects span { filter: blur(0px); opacity: 0.8; }
      .stacked { left: 24px; top: 580px; z-index: 1; }
      .asymmetric-shape {
        position: absolute;
        left: 250px;
        top: 612px;
        width: 45px;
        height: 22px;
        background: rgb(42, 120, 210);
        border: 2px solid rgb(20, 30, 40);
        border-left-color: rgb(200, 30, 40);
        border-radius: 4px 8px 4px 8px;
      }
    </style>
  </head>
  <body>
    <div class="card-backdrop" aria-hidden="true"></div>
    <section class="card">
      <h1 data-ppt-role="title">분기 <strong>성과</strong> 보고서</h1>
      <p class="body-copy" data-ppt-role="body">편집 가능한 <span style="font-weight: 700; color: rgb(31, 106, 229)">리치 텍스트</span>와 CJK 폴백을 검증합니다.</p>
      <p class="numeric" data-ppt-role="numeric">+24.8%</p>
      <small class="caption" data-ppt-role="caption">출처: H1 고정 fixture</small>
      <img
        class="safe-image"
        alt="safe red pixel"
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGP4oKDwHwAFZAIwtYA8zQAAAABJRU5ErkJggg=="
      >
      <div class="simple-shape" data-ppt-role="shape"></div>
    </section>

    <section class="fallback-zone">
      <p class="filtered" data-ppt-role="body">filter fallback</p>
      <p class="clipped" data-ppt-role="body">clip-path fallback</p>
      <p class="pseudo" data-ppt-role="body">pseudo fallback</p>
      <div class="overflow-box"><p data-ppt-role="body">overflow fallback content</p></div>
      <p class="occluded" data-ppt-role="body">occluded fallback</p>
      <div class="occluder"></div>
      <table><tbody><tr><td>complex</td><td>table</td></tr></tbody></table>
      <svg viewBox="0 0 160 90" xmlns="http://www.w3.org/2000/svg">
        <rect width="160" height="90" fill="#D9E7FF"></rect>
        <text x="12" y="48" font-size="18">SVG text</text>
      </svg>
      <p class="scaled" data-ppt-role="body">transform fallback</p>
      <p class="compound-effects" data-ppt-role="body"><span>descendant effects fallback</span></p>
      <p class="stacked" data-ppt-role="body">stacking fallback</p>
      <div class="asymmetric-shape" data-ppt-role="shape"></div>
    </section>
  </body>
</html>
