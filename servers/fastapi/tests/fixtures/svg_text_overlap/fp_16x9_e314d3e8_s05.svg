<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC" />

  <text x="56" y="49" font-family="Noto Sans KR" font-size="15" font-weight="bold" fill="#2563EB">투자 의사결정</text>
  <text x="56" y="101" font-family="Noto Sans KR" font-size="38" font-weight="bold" fill="#0F172A">투자 검증, 리스크 대응과 승인 요청</text>
  <text x="56" y="139" font-family="Noto Sans KR" font-size="19" font-weight="normal" fill="#475569">회수기간은 현금흐름 검증이 필요하며, 확대 기준은 경영진 승인이 필요합니다.</text>

  <line x1="56" y1="165" x2="1224" y2="165" stroke="#CBD5E1" stroke-width="1" />
  <text x="56" y="195" font-family="Noto Sans KR" font-size="20" font-weight="bold" fill="#0F172A">투자 검증 현황</text>

  <text x="56" y="231" font-family="Noto Sans KR" font-size="15" font-weight="normal" fill="#64748B">총 투자비</text>
  <text x="56" y="271" font-family="Noto Sans KR" font-size="30" font-weight="bold" fill="#0F172A">약 24억 원</text>
  <text x="249" y="231" font-family="Noto Sans KR" font-size="15" font-weight="normal" fill="#64748B">예상 회수기간</text>
  <text x="249" y="271" font-family="Noto Sans KR" font-size="30" font-weight="bold" fill="#0F172A">2.5년</text>
  <text x="432" y="231" font-family="Noto Sans KR" font-size="15" font-weight="normal" fill="#64748B">균등 회수 가정 시 연간 필요액</text>
  <text x="432" y="271" font-family="Noto Sans KR" font-size="30" font-weight="bold" fill="#2563EB">약 9.6억 원</text>

  <line x1="661" y1="205" x2="661" y2="290" stroke="#2563EB" stroke-width="3" />
  <text x="681" y="226" font-family="Noto Sans KR" font-size="16" font-weight="normal" fill="#334155">단계별 지출·편익 발생 시점과 운영비를 포함한</text>
  <text x="681" y="250" font-family="Noto Sans KR" font-size="16" font-weight="normal" fill="#334155">현금흐름이 없어 2.5년 회수기간은 검증할 수 없습니다.</text>
  <text x="681" y="281" font-family="Noto Sans KR" font-size="15" font-weight="normal" fill="#64748B">연 9.6억 원은 단순 균등 회수 가정의 필요액이며, 검증된 편익 전망치가 아닙니다.</text>

  <text x="56" y="329" font-family="Noto Sans KR" font-size="21" font-weight="bold" fill="#0F172A">주요 리스크와 확인 기준</text>

