  <text x="287" y="625" font-family="Noto Sans KR" font-size="17" font-weight="normal" fill="#0F172A">단계별 기간의 의미 · 24억 원의 배분 원칙 · 2.5년 회수기간의 산정 기준</text>
  <text x="287" y="654" font-family="Noto Sans KR" font-size="17" font-weight="normal" fill="#0F172A">3개 라인의 적용 우선순위 · 단계 종료 시 확대 기준</text>
