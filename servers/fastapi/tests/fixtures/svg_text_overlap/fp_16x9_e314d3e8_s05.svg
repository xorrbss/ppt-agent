    <text x="73" y="370" font-family="Noto Sans KR" font-size="16" font-weight="bold" fill="#0F172A">리스크</text>
    <text x="291" y="370" font-family="Noto Sans KR" font-size="16" font-weight="bold" fill="#0F172A">대응</text>
    <text x="634" y="370" font-family="Noto Sans KR" font-size="16" font-weight="bold" fill="#0F172A">효과·완료 확인 기준</text>

    <text x="73" y="407" font-family="Noto Sans KR" font-size="17" font-weight="bold" fill="#0F172A"><tspan x="73" y="407">현장 인력의</tspan><tspan x="73" y="431">변화 수용</tspan></text>
    <text x="291" y="407" font-family="Noto Sans KR" font-size="16" font-weight="normal" fill="#334155"><tspan x="291" y="407">정지·불량 기록 기준과</tspan><tspan x="291" y="431">경보 대응 교육</tspan></text>
    <text x="634" y="407" font-family="Noto Sans KR" font-size="16" font-weight="normal" fill="#334155"><tspan x="634" y="407">기록의 일관성과 조치 이력으로</tspan><tspan x="634" y="431">교육 효과 확인</tspan></text>

    <text x="73" y="469" font-family="Noto Sans KR" font-size="17" font-weight="bold" fill="#0F172A"><tspan x="73" y="469">레거시 설비의</tspan><tspan x="73" y="493">데이터 호환성</tspan></text>
    <text x="291" y="480" font-family="Noto Sans KR" font-size="16" font-weight="normal" fill="#334155">게이트웨이 표준화</text>
    <text x="634" y="469" font-family="Noto Sans KR" font-size="16" font-weight="normal" fill="#334155"><tspan x="634" y="469">설비별 원본 신호와 공통 형식 변환값을 대조해</tspan><tspan x="634" y="493">상태 오분류 점검</tspan></text>

    <text x="73" y="546" font-family="Noto Sans KR" font-size="17" font-weight="bold" fill="#0F172A">보안 체계 구축</text>
    <text x="291" y="546" font-family="Noto Sans KR" font-size="16" font-weight="normal" fill="#334155">OT 보안 진단</text>
    <text x="634" y="531" font-family="Noto Sans KR" font-size="16" font-weight="normal" fill="#334155"><tspan x="634" y="531">설비망 연결·원격 접속 권한·계정 관리·</tspan><tspan x="634" y="555">사고 시 생산 복구 지적사항의 조치 완료 확인</tspan></text>
