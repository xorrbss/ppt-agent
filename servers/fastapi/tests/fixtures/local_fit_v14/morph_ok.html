<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:Arial,sans-serif;background:#fff}
.root{position:absolute;left:80px;top:80px;width:700px;height:400px;background:#fff;border:1px solid #cbd5e1;padding:16px;display:flex;flex-direction:column;gap:2px}
.receiver{height:90px;padding:8px 0 0 0}
.lanes{height:82px}
.lane{display:grid;grid-template-columns:1fr;height:34px;position:relative}
.rail{position:relative;height:34px}
.bar{position:absolute;top:4px;height:26px;line-height:26px;padding:0 10px;white-space:nowrap;font-size:14px;color:#fff;border-radius:4px}
.bar-a{left:0;width:320px;background:#2563eb}
.bar-b{left:220px;width:320px;background:#16a34a}
.axis{height:24px;border-top:1px solid #94a3b8;font-size:13px;line-height:22px;color:#475569;padding-left:4px}
.donor{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;height:120px}
.panel{padding:10px;background:#f8fafc}
.tags{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;margin:0 0 8px 0}
.tag{display:inline-block;padding:4px 12px;border-radius:999px;background:#e2e8f0;color:#111827;font-size:13px;line-height:18px}
.note{font-size:14px;line-height:20px;color:#334155}
</style></head><body>
<main class="root" data-qid="root">
  <section class="receiver" data-qid="receiver">
    <div class="lanes" data-qid="lanes">
      <div class="lane" data-qid="lane">
        <div class="rail" data-qid="rail">
          <div class="bar bar-a" data-qid="bar-a">Design phase</div>
          <div class="bar bar-b" data-qid="bar-b">Build phase</div>
        </div>
      </div>
      <div class="axis" data-qid="axis">Q1 · Q2 · Q3 · Q4</div>
    </div>
  </section>
  <section class="donor" data-qid="donor">
    <div class="panel" data-qid="panel-1">
      <div class="tags" data-qid="tags">
        <span class="tag" data-qid="tag-1">Planning</span>
        <span class="tag" data-qid="tag-2">Design</span>
        <span class="tag" data-qid="tag-3">Build</span>
        <span class="tag" data-qid="tag-4">Launch</span>
        <span class="tag" data-qid="tag-5">Review</span>
      </div>
      <div class="note" data-qid="note-1">Phases share one delivery team.</div>
    </div>
    <div class="panel" data-qid="panel-2">
      <div class="note" data-qid="note-2">Milestones are reviewed quarterly.</div>
    </div>
  </section>
</main>
</body></html>
