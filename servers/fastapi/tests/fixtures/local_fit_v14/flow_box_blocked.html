<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:Arial,sans-serif;background:#fff}
.root{position:absolute;left:80px;top:100px;width:600px;height:180px;border:1px solid #cbd5e1;background:#fff;padding:16px}
.outer{height:100px;background:#f8fafc;border:1px solid #cbd5e1;padding:2px}
.inner{height:118px;background:#dbeafe;border:1px solid #93c5fd;padding:2px;font-size:15px;line-height:20px;color:#1e3a8a}
.foot{position:absolute;left:16px;right:16px;bottom:16px;height:24px;background:#334155;color:#fff;font-size:14px;line-height:24px;padding:0 12px}
</style></head><body>
<main class="root" data-qid="root">
  <section class="outer" data-qid="outer"><div class="inner" data-qid="inner">Inner card</div></section>
  <footer class="foot" data-qid="foot">Protected footer</footer>
</main>
</body></html>
