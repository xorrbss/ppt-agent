<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:Arial,sans-serif;background:#fff}
.root{position:absolute;left:80px;top:100px;width:800px;height:300px;background:#fff;border:1px solid #cbd5e1;padding:16px}
.card{height:200px;background:#eef2ff;border:1px solid #c7d2fe;padding:12px;font-size:16px;line-height:22px;color:#111827}
.band{position:absolute;left:16px;right:16px;bottom:60px;height:40px;background:#1e293b;color:#fff;font-size:16px;line-height:40px;padding:0 12px}
</style></head><body>
<main class="root" data-qid="root">
  <section class="card" data-qid="card"><div data-qid="card-text">Card body text</div></section>
  <div class="band" data-qid="band">Summary band</div>
</main>
</body></html>
