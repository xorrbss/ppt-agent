<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:Arial,sans-serif;background:#fff}
.root{position:absolute;left:80px;top:100px;width:800px;height:300px;background:#fff;border:1px solid #cbd5e1}
.bar{position:absolute;top:30px;height:24px;line-height:24px;padding:0 8px;white-space:nowrap;font-size:14px;color:#fff}
.bar-a{left:20px;width:320px;background:#2563eb}
.bar-b{left:220px;width:320px;background:#16a34a}
</style></head><body>
<main class="root" data-qid="root">
  <div class="bar bar-a" data-qid="bar-a">Design phase</div>
  <div class="bar bar-b" data-qid="bar-b">Build phase</div>
</main>
</body></html>
