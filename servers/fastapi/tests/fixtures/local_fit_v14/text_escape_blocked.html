<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:Arial,sans-serif;background:#fff}

</style></head><body>
<main class="root" data-qid="root">
  <section class="card" data-qid="card"><div data-qid="card-text">Line one.<br>Line two.<br>Line three.<br>Line four.<br>Line five.<br>Line six.<br>Line seven.</div></section>
  <footer class="foot" data-qid="foot">Protected footer</footer>
</main>
</body></html>
