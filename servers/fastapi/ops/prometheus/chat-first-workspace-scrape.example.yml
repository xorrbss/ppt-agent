scrape_configs:
  - job_name: chat-first-workspace-api
    # This aggregate-only route is outside session-authenticated /api. Restrict
    # it to the Prometheus network at the ingress/service boundary.
    metrics_path: /metrics/workspace
    static_configs:
      - targets:
          - api-1:8000
          - api-2:8000

  # Every external worker owns an independent in-process counter set. Set
  # WORKSPACE_OPERATION_METRICS_HOST=0.0.0.0 inside its isolated container (the
  # secure default is 127.0.0.1), assign a unique
  # WORKSPACE_OPERATION_METRICS_PORT/service target, and admit only Prometheus
  # with network policy. Alert rules aggregate every worker with sum().
  - job_name: chat-first-workspace-workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker-1:9101
          - worker-2:9102
