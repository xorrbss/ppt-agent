brief: >-
  MOOD: Build a rigorous, contemporary research deck with calm confidence and clear
  evidence hierarchy. It should feel like a well-edited university research report,
  never like a corporate pitch.

  PALETTE: Use a soft off-white background (#F7F8FA), ink black (#111827), scholarly
  blue (#1D4ED8), pale blue evidence panels (#DCE8FF), and slate secondary text
  (#64748B). Reserve blue for findings, links, and precise emphasis.
  Use the original palette with strong text/background contrast. Pale tints serve as surfaces, not low-contrast body text; differentiate critical states with wording or shape as well as color.

  TYPOGRAPHY: Use a restrained sans-serif hierarchy: large, compact bold titles;
  highly legible body copy; tabular numerals for metrics. Keep citations and source
  notes readable at a smaller but still practical size. Use an available Korean
  glyph-compatible font and phrase-based wrapping for Hangul text. Give equations
  their own line with space for fractions, subscripts, superscripts, and definitions;
  preserve mathematical symbols and the runtime typography floor when rearranging
  dense evidence.
  At 1280x720, use the Korean-safe stack "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif for Korean text. Body text should normally be 22-28px; captions and source notes preferably at least 16px. The hard minimum for every visible text run is 9.5pt (12.667px). Recompose, shorten or split content before reducing readability; never shrink below this floor. Preserve any genre-specific display-face accents only where Korean fallback remains clear.

  LAYOUT SYSTEM: Use a 12-column research grid, generous margins, aligned evidence
  cards, and thin rules. Put the claim first, then the supporting result, method, or
  citation directly beneath it. One primary finding per slide. Keep a visible gutter
  between columns, a dedicated source band, and enough table-row height for long
  study names. Use flat aligned evidence rows where cards would waste reading space.
  Make the research question, decisive figure and bounded interpretation readable in that order. Give one result a large field and keep method or limitations near the marks they qualify. Alternate motivation, method, result and synthesis pages with varying densities; the same academic grid need not frame every page. These are free compositional choices driven by content, never fixed layouts or required slots. Give the main evidence generous space and vary visual density across the deck.

  SIGNATURE ELEMENTS: Add section numbers, blue marginal rules, compact source keys,
  and study-design labels only when they carry source-supported information. Do not
  repeat section labels or badges that the title already makes clear, and never
  assign confidence levels to make a composition look complete.
  Use cobalt as a disciplined analytical emphasis and thin rules to distinguish result from interpretation. A small figure identifier is useful only when the deck actually references it; avoid ornamental institutional seals or faux publication headers.

  DATA VISUALIZATION: Prefer annotated dot plots, confidence intervals, simple bars,
  and compact comparison tables. Label axes, units, sample sizes, and uncertainty;
  use direct labels instead of legends whenever possible. Display source-reported
  uncertainty and sample sizes; mark essential missing fields as not reported.
  Keep comparison scales and confidence levels consistent, retain null/reference
  lines where meaningful, and distinguish observed results from hypotheses.
  State the outcome, unit, population or sample definition and comparison method. Show uncertainty intervals only when supplied and identify their type; a visual gap is not proof of significance. Separate exploratory observations from confirmed findings and keep limitations visible.

  IMAGE DIRECTION: Use high-resolution research photography, archival documents, or
  restrained abstract scientific textures with one focal point. Pair every image with
  a concise, visible source line when relevant.

  SLIDE ARCHETYPES: cover: an understated title, discipline label, and one narrow blue
  rule; content: a claim-led two-column explanation with citations; data: a single
  fully labeled chart plus a takeaway sentence; timeline: a horizontal study or
  project sequence with supplied dates or an explicitly ordinal sequence; section:
  one research question with a blue marginal rule; agenda: aligned research topics
  without invented findings; architecture: a conceptual or study-design map with
  defined variables and labeled relationships, distinguishing hypotheses from
  established links and routing arrows clear of equations; closing: a concise implication, next step,
  and reference cue.
  Additional forms: study-design sequence; directly labeled effect comparison; result figure with a bounded interpretation; sensitivity comparison across assumptions; synthesis that links the finding to a remaining research question.

  AVOID: Avoid decorative gradients, oversized unsourced quotations, dense paragraphs,
  ambiguous icons, tiny footnotes, and charts without units, sources, or uncertainty.
  Avoid invented p-values, uncited study claims, decorative error bars and dense literature tables that cannot be read.
