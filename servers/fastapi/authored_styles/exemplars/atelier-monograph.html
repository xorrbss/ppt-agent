<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>아틀리에 모노그래프 — 여백의 역할</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;background:#F6F2EF;color:#292529;font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}main{position:relative;width:1280px;height:720px;padding:47px 64px 36px}.masthead{display:flex;justify-content:space-between;font-size:16px;line-height:1.4;color:#60364D}.masthead span:first-child{font-weight:650}.spread{display:grid;grid-template-columns:534px 554px;gap:64px;margin-top:36px}.chapter{font-size:18px;color:#60364D;margin:0 0 19px;display:flex;align-items:center;gap:14px}.chapter-rule{display:block;width:36px;height:2px;background:#60364D}h1{font-family:"Noto Serif KR","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",serif;font-size:52px;line-height:1.3;letter-spacing:-1px;font-weight:600;margin:0 0 28px}.lead{font-size:23px;line-height:1.55;max-width:476px;margin:0 0 30px}.notes{border-top:1px solid #BFB0B6;padding-top:21px;max-width:476px}.notes h2{font-size:20px;font-weight:650;line-height:1.4;margin:0 0 10px}.notes p{font-size:20px;line-height:1.55;margin:0;color:#55464F}.art{margin:0}.specimen{position:relative;background:#E4DCD5;width:554px;height:408px;overflow:hidden}.plane{position:absolute;left:80px;top:70px;width:272px;height:270px;background:#CDBFC3}.circle{position:absolute;left:193px;top:82px;width:236px;height:236px;border-radius:50%;background:#60364D}.cut{position:absolute;left:193px;top:82px;width:118px;height:236px;background:#F6F2EF}.rule{position:absolute;left:45px;right:45px;bottom:38px;height:1px;background:#7D6973}.caption{display:grid;grid-template-columns:55px 1fr;gap:15px;margin-top:20px;font-size:17px;line-height:1.5;color:#55464F}.caption .number{color:#60364D;font-weight:650}.caption p{margin:0}footer{position:absolute;bottom:29px;left:64px;right:64px;display:flex;justify-content:space-between;gap:24px;font-size:16px;line-height:1.4;color:#55464F;border-top:1px solid #BFB0B6;padding-top:15px}
</style>
</head>
<body>
<main>
  <header class="masthead"><span>아틀리에 모노그래프</span><span>형태와 읽기의 관계</span></header>
  <div class="spread">
    <section>
      <p class="chapter"><span class="chapter-rule" aria-hidden="true"></span>시각 연구 · 개념</p>
      <h1>여백은<br>해석의 자리입니다.</h1>
      <p class="lead">하나의 형태에 시선이 머무르면,<br>그 옆의 짧은 문장은 더 분명한<br>설명이 됩니다.</p>
      <div class="notes">
        <h2>형태를 보여주고, 관점을 덧붙입니다.</h2>
        <p>제목과 도형, 해설 사이의 거리를 조절해<br>보는 순서가 곧 읽는 순서가 되게 합니다.</p>
      </div>
    </section>
    <figure class="art">
      <div class="specimen" role="img" aria-label="사각 평면과 반원이 겹쳐진 오버진과 본화이트 색의 직접 저작 추상 연구">
        <div class="plane"></div><div class="circle"></div><div class="cut"></div><div class="rule"></div>
      </div>
      <figcaption class="caption"><span class="number">도판 01</span><p>겹침과 간격에 관한 직접 저작 기하 연구.<br>실제 브랜드 프로젝트나 제품 이미지가 아닙니다.</p></figcaption>
    </figure>
  </div>
  <footer><span>디자인 언어를 설명하기 위한 독자적 구성 예시</span><span>05</span></footer>
</main>
</body>
</html>
