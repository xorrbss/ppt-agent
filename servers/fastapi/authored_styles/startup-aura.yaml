brief: |-
  MOOD
  낙관적이고 인간적이며 빠르게 움직이는 초기 팀의 에너지. 과장된 미래주의 대신 믿을 수 있는 자신감을 만든다.

  PALETTE
  크림 배경 #FFF8F1을 기본으로 하고 잉크 네이비 #1D2433로 본문을 읽기 쉽게 유지한다. 코랄 #FF6B4A는 하나의 결론과 행동 유도에만, 살구 #FFCA7A와 민트 #B8E7D1은 보조 색면에 사용한다.

  TYPOGRAPHY
  제목은 굵은 산세리프를 짧게 2줄 이하로 배치하고, 본문은 중간 굵기의 산세리프로 편안하게 읽힌다. 핵심 숫자는 본문보다 훨씬 크게 두고 문장 끝의 마침표처럼 보이게 한다.

  LAYOUT SYSTEM
  12열의 느슨한 정렬을 사용하되 모든 요소를 상자에 가두지 않는다. 좌측의 큰 주장과 우측의 사진 또는 증거를 짝지으며, 넓은 여백과 둥근 색면으로 리듬을 만든다.

  SIGNATURE ELEMENTS
  코랄 점, 부드러운 반원, 손으로 붙인 듯한 작은 라벨, 한 단어를 감싸는 반투명 하이라이트를 사용한다. 검은 격자, 산성 라임, 날카로운 모서리는 사용하지 않는다.

  DATA VISUALIZATION
  큰 단일 수치, 둥근 막대, 간결한 성장 곡선, 세 단계의 비교를 선호한다. 축과 범례는 필요할 때만 얇게 표시하고 코랄은 가장 중요한 값 하나에만 쓴다.

  IMAGE DIRECTION
  실제 팀의 작업 장면, 손에 든 제품, 자연광의 인물, 질감 있는 제품 클로즈업을 사용한다. 인물은 편안하고 진짜처럼 보이며 과도하게 연출된 사무실 스톡 사진은 피한다.

  SLIDE ARCHETYPES
  cover: 크림 배경 위에 짧은 비전 문장, 코랄 점, 작은 회사 표기를 둔다.
  content: 큰 주장과 한 장의 사진 또는 두 개의 증거 카드로 한 메시지만 설명한다.
  data: 하나의 핵심 지표를 크게 두고 보조 추세를 둥근 막대나 부드러운 선으로 붙인다.
  timeline: 살구와 민트 라벨을 번갈아 둔 느슨한 3~5단계 여정으로 표현한다.
  closing: 감사 문구와 다음 대화로 이어지는 한 문장, 코랄 연락처 표기를 남긴다.

  AVOID
  촘촘한 표, 기업 보고서 같은 회색 카드 벽, 네온 글로우, 복잡한 아이콘 묶음, 한 슬라이드에 여러 개의 주장.
