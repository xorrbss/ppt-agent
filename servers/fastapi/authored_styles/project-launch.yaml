brief: |-
  MOOD
  차분하지만 추진력 있는 실행 회의. 참석자가 다음 행동과 책임자를 한눈에 이해하도록 만든다.

  PALETTE
  아주 옅은 청회색 #F5F7FB과 짙은 잉크 #172033를 기본으로 한다. 신뢰감 있는 파랑 #2563EB를 진행 상태와 행동에 사용하고, 하늘색 #52B6FF와 옅은 파랑 #DCEBFF는 단계와 배경 구분에만 쓴다.

  TYPOGRAPHY
  짧고 단호한 산세리프 제목, 읽기 쉬운 본문, 숫자와 날짜를 위한 굵은 모노스페이스 보조 표기를 사용한다. 제목은 한 줄 중심, 세부 정보는 작은 라벨과 명확한 행간으로 정리한다.

  LAYOUT SYSTEM
  엄격한 좌우 정렬과 일정한 여백을 유지한다. 슬라이드는 큰 제목 영역, 핵심 결정 영역, 상세 실행 영역의 세 층으로 구성하며 얇은 구분선과 제한된 카드만 사용한다.

  SIGNATURE ELEMENTS
  파란 진행선, 번호가 든 작은 원, 날짜 배지, 연결선이 있는 체크포인트를 사용한다. 프리즘 유리 면, 보라 네온, 복잡한 사이버 인터페이스는 사용하지 않는다.

  DATA VISUALIZATION
  목표 대비 진행률, 마일스톤 간트 막대, 책임자별 용량 막대, 간결한 위험 신호를 사용한다. 중요 상태는 파랑, 주의는 중립적인 진한 잉크로 표시하며 색을 과다하게 늘리지 않는다.

  IMAGE DIRECTION
  실제 제품 화면, 작업 중인 팀, 명료한 제품 클로즈업을 사각 프레임으로 사용한다. 장식용 추상 이미지는 최소화하고 이미지에는 항상 실행 맥락이 있어야 한다.

  SLIDE ARCHETYPES
  cover: 프로젝트명, 시작일, 한 줄 목표를 깨끗한 파란 선과 함께 둔다.
  content: 결정 문장 하나와 담당·기한·산출물의 3열 실행 요약을 둔다.
  data: 하나의 진행률 또는 자원 비교를 정렬된 막대와 직접 표기로 보여 준다.
  timeline: 좌에서 우로 이어지는 4~6개 체크포인트와 날짜 배지를 사용한다.
  closing: 다음 결정, 회의 후 행동, 책임자 확인을 짧은 체크리스트로 마무리한다.

  AVOID
  감성적인 그라데이션, 거대한 장식 숫자, 느슨한 콜라주, 불필요한 3D, 한 장에 여러 종류의 차트.
