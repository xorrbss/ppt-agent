illustration:
  style_prompt: >-
    flat 2D vector infographic illustration, simple rounded geometric people
    and objects, teal (#0E7C7B) and coral (#F2545B) with warm sand accents on
    a white background, no outlines or thin uniform outlines, modern corporate
    editorial style, balanced negative space, no gradients
reference_images:
  content: [catalogue-previews/flat-infographic.png]
svg_overrides:
  resolved_sections: [GENERAL]
  common_guidance:
    - "Keep all meaningful text as explicit SVG text/tspan elements -- never rendered inside a raster image."
    - "For illustration-led slides, build around one flat illustration image slot that anchors the story -- sized to roughly half the slide -- with structured SVG elements around it: numbered step chips, role groups, or short bullet text aligned to a clear grid."
    - "architecture archetype: draw source-supported roles or components as SVG text labels and polygon/line connectors with a clear reading direction; keep decorative characters outside the relationship diagram."
brief: |-
  MOOD: Create a friendly, modern business explainer — the visual language of
  a well-designed annual report infographic. Approachable but disciplined:
  playful shapes, serious structure.

  PALETTE: Use near-white (#FAFBFC) as the canvas, deep teal (#0E7C7B) as the
  primary structural color, coral (#F2545B) as the single emphasis color,
  dark slate ink (#1D2B36) for text, and warm sand (#F4E9DB) for soft
  background panels. Coral marks exactly one focus per slide.
  Use the original palette with strong text/background contrast. Pale tints serve as surfaces, not low-contrast body text; differentiate critical states with wording or shape as well as color.

  TYPOGRAPHY: A clean geometric sans-serif. Big confident titles, medium
  labels with generous letter spacing for section markers, comfortable body
  text. All text is HTML — never inside images.
  Keep complete Korean labels and source notes readable with the installed Korean-capable fallback and runtime typography policy; preserve required wording by reallocating illustration space.
  At 1280x720, use the Korean-safe stack "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif for Korean text. Body text should normally be 22-28px; captions and source notes preferably at least 16px. The hard minimum for every visible text run is 9.5pt (12.667px). Recompose, shorten or split content before reducing readability; never shrink below this floor. Preserve any genre-specific display-face accents only where Korean fallback remains clear.

  LAYOUT SYSTEM: For illustration-led slides, build around one flat illustration slot that anchors
  the story — a scene of simple characters or objects sized to roughly half
  the slide — with structured HTML around it: numbered steps, role cards, or
  short bullets aligned to a clear grid. Alternate the slot between left,
  right and banner positions across the deck. Reserve the slot area with
  explicit sizing so the layout survives without the image.
  Let the illustration slot contract or disappear when a table, process or long Korean explanation needs the main field. Prefer open aligned text groups over repeated role cards, and keep scene details away from labels and connectors. Use body text with natural wrapping rather than shrinking it to preserve the half-slide illustration.
  Organize each slide around one understandable relationship: movement, comparison, composition or sequence. Combine a large flat illustration with precise adjacent data only when both explain the same point. Use irregular but aligned content areas and alternate process views with quantitative views and short conclusions. These are free compositional choices driven by content, never fixed layouts or required slots. Give the main evidence generous space and vary visual density across the deck.

  SIGNATURE ELEMENTS: Rounded geometric characters and objects, soft sand
  panels behind text groups, numbered step chips, thin teal rules, one coral
  focal element per slide, generous whitespace.
  Repeat a small vocabulary of clean silhouettes, rounded connectors and teal/coral accents. Let objects label real stages or categories; use geometry as explanation rather than filling empty space with icons.

  DATA VISUALIZATION:
  Render data charts as inline SVG in the teal/coral system with direct labels, explicit units and honest scales. Use a donut only for a supported part-to-whole relationship with a known total, and label process flows as qualitative. Keep values, time periods and sources faithful to the input. Illustration scenes may support interpretation but must not carry chart labels, numbers, or factual relationships.
  Keep pictograms decorative unless a stated counting key makes them quantitative. Prefer aligned bars, a proportional strip or numbered stages; reserve coral for the focal exception and name it in text. Label sample quantities and denominators, and do not use object size as an undocumented scale.

  IMAGE DIRECTION: When an illustration helps, describe one warm, simple scene that embodies
  the concept (people collaborating at a desk, a handshake, a growing plant
  beside a graph pedestal, parcels on a conveyor). Composition only — no
  text or numbers in the image.

  SLIDE ARCHETYPES:
  cover: Place the title beside a welcoming hero scene with a single clear focal subject.
  agenda: Use an open list of topics with small numbered navigation marks and one optional compact scene.
  section: Pair the section name with a simple flat object that fits the subject; keep supporting text minimal.
  content: Pair a scene with the number of structured points the source needs. Use a wider text field for longer Korean explanations.
  data: Give a dominant SVG chart or table the main field and keep a supporting scene small or omit it.
  timeline: Use numbered stages and short labels from the source. Use actual dates only when provided and turn long captions into a readable vertical sequence.
  architecture: Draw source-supported roles or components as HTML/SVG labels and connectors with a clear reading direction; use decorative characters outside the relationship diagram.
  closing: Present the supported takeaway and requested next action, with an optional small scene whose mood suits the conclusion.
  Additional forms — measured process journey; proportional resource strip; ranked category bars paired with one scene; service comparison with consistent icons; cause-and-response diagram with labeled relationships.

  AVOID: Avoid text baked into images, photographic imagery, drop shadows,
  gradients, more than one coral emphasis, crowded scenes with many
  characters, and clip-art-style inconsistent illustration mixing.
  Avoid a row of unrelated icons, arbitrary bubble sizes, fake counts and pastel foreground text with weak contrast.
