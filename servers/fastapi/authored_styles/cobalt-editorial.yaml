brief: |-
  MOOD: Build a lucid, cultured editorial deck with deep cobalt fields, luminous
  paper-colored type, and decisive composition. It should feel closer to a designed
  quarterly or critical journal than to a warm tritone magazine.

  Build a cultured blue editorial argument with the energy of a museum identity: confident color, a strong edge and carefully located yellow annotations.

  PALETTE: Use midnight navy (#071B4F) and cobalt (#1848C8) as principal fields,
  ice blue (#DCE8FF) and white (#FFFFFF) for type and quiet surfaces, and signal
  yellow (#FFCB47) for sparing emphasis. Never use more than one bright accent on a slide.

  Preserve midnight navy, cobalt, pale blue and yellow. Keep white text on navy/cobalt, navy text on yellow, and use pale blue only when its contrast against the field remains clear.

  TYPOGRAPHY: Use a high-character display serif or precise grotesk for headlines and
  a neutral sans-serif for reading text. Set large, confident titles with compact
  supporting copy; preserve generous leading and strong color contrast.
  Use an installed Korean-capable fallback for full phrases and source notes, reserving display faces for short titles. Preserve required wording and follow the runtime typography policy.

  Use a strong editorial title with a compact line count and neutral sans-serif analysis. Separate the page index from the headline so it does not resemble a second claim. All Korean text must resolve through a local stack including "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif. At a 1280x720 canvas, target body 22-28px and labels at least 16px; 9.5pt (12.667px) is the hard floor for every text run, including SVG, captions and sources. If text cannot fit, shorten with evidence intact or split the slide; never shrink below the floor.

  LAYOUT SYSTEM: Use bold editorial frames, offset text blocks, full-bleed cobalt
  panels, and a strict underlying column grid. Alternate dramatic image-led slides
  with quiet paper panels so the deck has rhythm without visual noise.
  Keep paper panels broad enough for complete Korean phrases and reserve margin annotations for brief labels. Alternate a photograph spread, an open text page and a wide evidence panel according to the content; shrink the cobalt frame before squeezing body copy.

  Use a deep-cobalt image or diagram field opposed by a white reading area; vary that proportion freely with the content. Alternate full blue argument pages, light comparison spreads and architectural image studies. Keep one principal chart and no more than three annotations on a blue field; move dense tables onto white. These are flexible compositional directions for freely authored HTML/CSS, not fixed layouts, slots, Deck IR or a layout engine.

  SIGNATURE ELEMENTS: Use yellow index marks, blue-on-paper folios, cropped image
  windows, oversized section numerals, and short marginal annotations.

  Use a yellow index tab, a large cropped blue numeral and aligned white caption rules. A yellow mark must identify the active observation, not scatter across every element.

  DATA VISUALIZATION:
  Use paper-background charts framed by cobalt, with cobalt marks and yellow for the decisive supported comparison. Keep navy text on yellow accents and use paper or pale-blue text on dark fields. Directly label values with their units and retain source dates, comparison baselines and provenance when supplied. Use consistent scales and proportional marks, and present a qualitative comparison when the input has no measurements.

  Place white or pale-blue comparison marks on navy and dark-blue marks on paper. Attach values directly; use yellow for one selected series. Prefer a paired comparison, annotated distribution or three-stage evidence sequence with explicit scales and source labels.

  IMAGE DIRECTION: Use high-contrast editorial photography, architectural geometry,
  cultural artifacts, and bold monochrome crops with cobalt overlays. Keep image
  treatment crisp and intentional, never nostalgic or scrapbook-like.

  Choose architectural geometry, a single high-contrast documentary crop or original angular blue forms that connect to the topic. Maintain readable caption space outside the crop.

  SLIDE ARCHETYPES:
  cover: Use a cobalt field, oversized title and one yellow index mark.
  agenda: Place topics in a broad paper panel with cobalt rules and yellow navigation indices; avoid narrow cards for long names.
  section: Use a cobalt field with the section name and an oversized navigation numeral separated from body content.
  content: Let a paper reading panel cut into a cobalt frame, paired with a cropped image only when it helps explain the subject.
  data: Give the chart or table most of a paper field, with one supported finding marked in yellow and a readable source note.
  timeline: Use an open numbered sequence on alternating cobalt and paper fields. Make dates optional and keep each caption readable without card compression.
  architecture: Place labeled components on paper with cobalt connectors and explicit relationship labels. Reserve yellow for one relevant component.
  closing: Use a concise evidence-backed conclusion and a final image or index mark; include a next action only when supported.

  Compose — cobalt thesis opening; paper evidence comparison with a yellow index; architectural image-and-caption study; blue field with one oversized statistic and context; three-stage annotated sequence; quotation spread; source-backed closing position.

  AVOID: Avoid cream-coral-black tritone, soft blush palettes, rounded pastel cards,
  generic tech gradients, illegible blue-on-blue text, excessive yellow, and crowded
  collage spreads.

  Do not invent claims, measurements, quotations, citations or provenance. Keep illustrative data visibly labeled and supplied evidence traceable. Avoid repeating the same composition throughout a deck; alternate the narrative scenes above while retaining this style's visual identity. Keep all original reference images and their provenance intact.
