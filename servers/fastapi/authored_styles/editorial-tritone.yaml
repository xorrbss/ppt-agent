brief: |-
  VISUAL DIRECTION
  - Create an art-directed magazine feel using warm cream space, near-black ink, and coral punctuation.

  LAYOUT
  - Compose deliberate text-image relationships, asymmetric columns, generous margins, and occasional full-bleed moments.
  - Use oversized pull quotes or numerals as editorial anchors rather than repeating card grids.

  TYPOGRAPHY
  - Establish expressive contrast between display headlines, compact captions, and calm reading text.

  COLOR AND DATA
  - Keep the palette strictly tritone and use coral only to direct attention.
  - Treat data as editorial evidence with thin rules, annotated figures, and uncluttered tables.

  AVOID
  - Avoid corporate-blue defaults, glossy effects, generic icon rows, and uniform modular panels.
