brief: |-
  MOOD
  Create a premium strategy-consulting atmosphere with deep navy fields, cool blue highlights, and decisive analytical confidence. Every slide should advance an argument or decision.

  PALETTE
  Use deep navy #0B1F3A and secondary navy #102A4C as dominant fields, pale blue #E6F4FF and white #FFFFFF for readable contrast, and sky blue #38BDF8 for emphasis. On light analysis surfaces use deep navy for text and labels; keep sky blue as an accent rather than small text on white.
  Use the original palette with strong text/background contrast. Pale tints serve as surfaces, not low-contrast body text; differentiate critical states with wording or shape as well as color.

  TYPOGRAPHY
  Pair compact uppercase Latin labels with authoritative sans-serif headlines, highly legible supporting text, and tabular numerals. Use available Korean-capable sans-serif faces, natural Hangul spacing, and phrase-based title wraps. Keep titles declarative and concise without forcing long Korean text into a single line. Reflow evidence before shrinking text and respect the runtime typography floor.
  At 1280x720, use the Korean-safe stack "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif for Korean text. Body text should normally be 22-28px; captions and source notes preferably at least 16px. The hard minimum for every visible text run is 9.5pt (12.667px). Recompose, shorten or split content before reducing readability; never shrink below this floor. Preserve any genre-specific display-face accents only where Korean fallback remains clear.

  LAYOUT SYSTEM
  Use disciplined asymmetric compositions, decisive alignment, and clear zones for evidence and conclusions. Alternate dark statement slides with lighter analytical slides to control pacing. Keep a stable title anchor and outer margins across both surfaces. Give long Korean explanations a wider evidence column or stacked rows, keeping a separate source strip and avoiding a compulsory finding band on already sparse section slides.
  Build each page around the decision being made, with a dominant evidence field and a quieter implication placed beside or below it. Choose the form from the question: compare alternatives, trace a causal chain or map a sequence. Alternate dark synthesis pages with airy evidence pages using the existing palette; no diagram form is compulsory. These are free compositional choices driven by content, never fixed layouts or required slots. Give the main evidence generous space and vary visual density across the deck.

  SIGNATURE ELEMENTS
  Use thin luminous rules, compact strategy labels, restrained KPI callouts, angled section markers, and a consistent finding band that points to the implication.
  Use the blue accent to trace the selected strategic path and keep viable alternatives visible in subdued but readable marks. A thin linking line may connect evidence to implication; it must carry an explicit relationship rather than imply causality by proximity.

  DATA VISUALIZATION
  Draw precise comparison bars, trend lines, waterfalls, and compact tables with direct labels, visible units, periods, and supplied sources. Start magnitude bars at zero, preserve comparable scales, and use waterfalls only for additive contributions with reconciled totals. Distinguish measured results from targets or assumptions. Use sky blue for the decision-relevant evidence, including risks; do not invent metrics or fill gaps in dates, owners, or status.
  Connect claim, source evidence, interpretation and decision without merging them. Compare options on the same named criteria and show their trade-offs; do not create weighted scores or precision without a supplied method. Distinguish observations, assumptions and scenarios. Surface confidence limits and the evidence that could reverse a recommendation; absent sources remain explicitly unverified.

  IMAGE DIRECTION
  Use tightly cropped infrastructure, market, leadership, or product imagery with cool tonal control and clear negative space. Prefer analytical evidence when an image adds no context.

  SLIDE ARCHETYPES
  cover: Use a full navy field, authoritative title, context line, and one thin luminous rule.
  section: Place a concise chapter heading on navy with one angled marker and an optional supplied transition statement.
  agenda: Use aligned pale-text topic rows separated by fine navy rules, with sky blue indicating only the current section when known.
  content: Place a declarative claim beside structured evidence and a concise strategic implication.
  architecture: Arrange capabilities or responsibilities in aligned layers with light labels on navy, reserving clear connector gutters. Use sky blue for one relevant flow and arrows only for evidenced direction.
  data: Feature one dominant analytical chart with a highlighted finding and source line.
  timeline: Show the supplied strategic milestones with decisions and any provided owners or status cues. Use a vertical rail when labels are long; equal step spacing denotes order, not an invented duration.
  closing: Summarize the supported recommendation and prioritized actions, with an executive checkpoint only if supplied.
  Additional strategy forms — option comparison with a visible trade-off; evidence-to-decision chain with assumptions separated; scenario range with an explicit trigger; priority map with named axes and a rationale; dependency sequence ending in a decision checkpoint.

  AVOID
  Avoid playful shapes, soft pastel palettes, heavy gradients, dense dashboard walls, vague topic titles, and decorative blue accents that compete with the core conclusion.
  Avoid unsupported 2x2 positioning, causal arrows between merely correlated facts, false certainty and converting every page into a decision matrix.
