brief: |-
  VISUAL DIRECTION
  - Create a premium strategy-consulting atmosphere with deep navy fields and cool blue highlights.

  LAYOUT
  - Use disciplined asymmetric compositions, decisive alignment, and clear zones for evidence and conclusions.
  - Alternate dark full-bleed statements with lighter analytical slides to control pacing.

  TYPOGRAPHY
  - Pair compact uppercase labels with authoritative headlines and highly legible supporting text.

  COLOR AND DATA
  - Use navy as the dominant field, sky blue for emphasis, and white or pale blue for contrast.
  - Draw precise charts, thin luminous rules, and restrained KPI callouts without decorative noise.

  AVOID
  - Avoid playful shapes, soft pastel palettes, heavy gradients, and dense dashboard walls.
