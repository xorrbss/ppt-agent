brief: |-
  MOOD
  Create a rigorous, trustworthy Korean financial-technology proposal that feels ready for an executive review at a bank. Balance institutional stability with a confident digital-transformation tone. Every slide should communicate one defensible business claim through disciplined information design.

  PALETTE
  Use white #FFFFFF as the primary canvas, deep navy #173A63 for headings and structural anchors, and cobalt #0879B7 for the main reading path, section bars, and diagrams. Use pale blue #DCECF6 for information zones and table fills. Reserve red #E7352A for one critical warning, exception, or priority signal per slide. Dark section dividers may invert to navy with white type.

  TYPOGRAPHY
  Use Noto Sans KR throughout. Titles are bold, compact, and phrased as conclusions. Use medium-weight labels and regular body copy with clear hierarchy. Keep body copy short, align numerals carefully in tables, and use IBM Plex Mono only for small system identifiers or technical metadata. All meaningful text must remain editable HTML rather than being embedded in generated images.

  LAYOUT SYSTEM
  Use a wide 16:9 corporate grid with generous outer margins, a stable top title zone, and a thin section or progress indicator when useful. White content slides should combine one dominant diagram or table with concise supporting copy. Dark navy slides should feature a single central solution system with surrounding modules. Keep alignment strict, grouping obvious, and reading order left-to-right or top-to-bottom.

  SIGNATURE ELEMENTS
  Use slim blue section bars, rounded pale-blue panels, navy headline bands, precise connector lines, numbered process nodes, restrained iconography, smartphone interface frames, and small red priority markers. Tables should use blue header fills and subtle row rules. Treat every visual element as part of one connected argument rather than as decoration.

  DATA VISUALIZATION
  Favor comparison tables, grouped bars, progress rails, maturity matrices, and timeline bands that can be read quickly by executives. Direct-label important values, use blue intensity to encode hierarchy, and keep axes and legends minimal but unambiguous. Use a single red marker only to identify risk or required attention. Charts, tables, and values must be editable HTML or inline SVG.

  IMAGE DIRECTION
  Use polished mobile-banking UI frames, abstract secure-data networks, and restrained professional human imagery only when they directly support the slide claim. Prefer original vector-like financial IT illustrations over generic stock photography. Reference images define composition and visual hierarchy only; never reproduce their wording, logos, company marks, watermarks, or exact object arrangement.

  SLIDE ARCHETYPES
  cover: Place a bold proposal title and concise subtitle in a clean left-aligned field, balanced by one focused mobile-banking or secure-digital visual.
  content: Combine one structured process, comparison, or priority framework with short evidence labels and a clear bottom-line takeaway.
  architecture: Use one central navy solution platform with three to six connected domains, visible data flow, and a concise implication ribbon.
  data: Build one dominant comparison table or chart family with direct labels, blue hierarchy, and a short interpretation panel.
  timeline: Use a single horizontal program rail with four to six phases, aligned milestone labels, and one highlighted current or critical phase.
  closing: Present three decisive priorities or outcomes beside one memorable digital-banking system visual and one clear next action.

  AVOID
  Avoid generic card mosaics, playful consumer-app styling, excessive gradients, decorative 3D objects, mismatched icon styles, dense paragraphs, oversized logos, unexplained abbreviations, ambiguous arrows, more than one red emphasis signal, unreadable table text, text inside generated images, copied source wording, copied brand marks, and conclusions unsupported by the visual evidence.
