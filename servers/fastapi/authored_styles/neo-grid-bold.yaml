brief: |-
  VISUAL DIRECTION
  - Build an energetic neo-brutalist system with visible grids, sharp corners, and intentional high-contrast geometry.

  LAYOUT
  - Use modular divisions, cropped oversized elements, hard alignment, and dramatic scale shifts while preserving fit.
  - Vary the grid across slides so the deck feels rhythmic rather than templated.

  TYPOGRAPHY
  - Favor oversized bold type, compressed labels, and terse copy with uncompromising hierarchy.

  COLOR AND DATA
  - Ground slides in black or off-white and use acid lime as the dominant signal color with rare violet support.
  - Render charts as bold geometric statements with direct labels and thick, purposeful marks.

  AVOID
  - Avoid rounded cards, soft shadows, muted corporate layouts, and decorative complexity without meaning.
