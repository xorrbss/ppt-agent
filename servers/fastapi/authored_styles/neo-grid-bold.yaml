svg_overrides:
  # LAYOUT SYSTEM: the composition line is html-only only for the shared
  # "freely authored HTML/CSS" boilerplate; the intent (unequal aligned
  # zones, alternation, matrix limit) is restated below for SVG.
  resolved_sections: [LAYOUT SYSTEM]
  layout_hints:
    - "Use unequal but aligned rect zones with thick rule lines (wide stroked rects or lines) and strong negative space. Alternate a black thesis slide, a light comparison matrix and a typography-led decision slide across the deck. Limit a matrix to three options and four criteria; extend the canvas for dense evidence instead of filling every grid cell. Compose freely from SVG primitives rather than a fixed slot grid."
brief: |-
  MOOD
  Build an energetic neo-brutalist system with visible structure, sharp corners, and intentional high-contrast geometry. The tone should feel direct, provocative, and controlled.

  Make the grid feel assertive and purposeful: a sharp claim, a clearly partitioned comparison and a single acid-colored decision cue.

  PALETTE
  Ground slides in black #111111 or off-white #F5F5F0, use acid lime #D9FF3F as the dominant signal, and reserve violet #7C3AED for rare secondary contrast.

  Preserve near-black, acid lime, warm light neutral and controlled violet. Use black text on lime and light text on black/purple; thin lime marks need a dark surrounding field.

  TYPOGRAPHY
  Favor oversized bold type, compressed labels, terse copy, and uncompromising hierarchy. Crop display type only when the complete message remains immediately understandable.
  Keep complete Korean phrases readable in spanning text regions rather than compressing glyphs or tracking. Preserve required wording and follow the runtime typography policy.

  Use a heavy modern sans-serif for short headlines and a neutral sans-serif for the analytical field. Avoid all-caps Korean tracking or oversized labels that crowd the evidence. All Korean text must resolve through a local stack including "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif. At a 1280x720 canvas, target body 22-28px and labels at least 16px; 9.5pt (12.667px) is the hard floor for every text run, including SVG, captions and sources. If text cannot fit, shorten with evidence intact or split the slide; never shrink below the floor.

  LAYOUT SYSTEM
  Use modular divisions, hard alignment, cropped oversized elements, and dramatic scale shifts while preserving fit. Vary the grid across slides so the deck feels rhythmic rather than templated.
  Use the grid to align material rather than forcing every slide into the same module count. Give long Korean text a wide spanning cell, reduce oversized decorative crops when necessary, and keep thick grid lines out of labels and paragraph space.

  Use unequal but aligned editorial zones with thick rules and strong negative space. Alternate a black thesis, a light comparison matrix and a typography-led decision page. Limit a matrix to three options and four criteria; extend dense evidence instead of filling every grid cell. These are flexible compositional directions for freely authored HTML/CSS, not fixed layouts, slots, Deck IR or a layout engine.

  SIGNATURE ELEMENTS
  Use exposed grid lines, square index markers, thick underline bars, high-contrast labels, and one oversized geometric crop. Keep every mark tied to hierarchy or navigation.

  Use a large cropped index, square corner marks and one lime decision band. Purple remains a controlled secondary block; each hard edge should organize content rather than box every paragraph.

  DATA VISUALIZATION
  Render charts as clear geometric evidence with direct labels, explicit units and a visible meaningful scale. Reserve acid lime for the decisive supported value, using dark text on lime. Make mark lengths or areas proportional to supplied values and keep grid decoration distinct from chart axes. Retain source context and do not invent a quantitative comparison for a purely qualitative claim.

  Use a blunt ranked bar, a criteria matrix or a baseline/proposal comparison with direct labels. Explain scoring methods when supplied; do not invent weighted scores or let decorative block area imply market share.

  IMAGE DIRECTION
  Use stark flash photography, graphic product crops, urban textures, or high-contrast portraits framed by hard rectangular masks. Keep imagery punchy and uncluttered.

  Draw original bold geometric cutouts or use a high-contrast sourced crop with a precise caption. Keep images subordinate to the comparison structure and preserve all reference provenance.

  SLIDE ARCHETYPES
  cover: Combine an oversized title, one exposed grid boundary and one acid-lime signal.
  agenda: Use a strong index rail with broad topic rows, allowing long labels to span grid cells.
  section: Use a large section name and one square index marker within a spare grid.
  content: Divide the field into unequal areas only as needed for the claim and evidence, using one spanning reading region for longer Korean copy.
  data: Place a comparison table or proportional geometric chart in a broad field with visible scale and source labels.
  timeline: Use numbered stages along a shared datum, sized to actual milestones. Reserve the active marker for a stage identified in the source.
  architecture: Use labeled rectangular zones and direct connectors on the grid for source-supported components and relationships.
  closing: Finish with the supported conclusion or requested action in one strong high-contrast frame.

  Compose — bold thesis-and-evidence spread; three-option criteria matrix; ranked comparison; process sequence across unequal zones; image-and-counterpoint study; risk/decision ledger; closing action with an explicit evidence condition.

  AVOID
  Avoid rounded cards, soft shadows, muted corporate layouts, gratuitous distortion, dense decorative complexity, and acid lime applied without informational purpose.

  Do not invent claims, measurements, quotations, citations or provenance. Keep illustrative data visibly labeled and supplied evidence traceable. Avoid repeating the same composition throughout a deck; alternate the narrative scenes above while retaining this style's visual identity. Keep all original reference images and their provenance intact.
