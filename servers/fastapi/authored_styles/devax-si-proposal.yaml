svg_overrides:
  resolved_sections: [TYPOGRAPHY, SIGNATURE ELEMENTS]
  common_guidance:
    - "Use tokens.heading_font/tokens.body_font (Pretendard falling back to Noto Sans KR) for every text element. Titles are compact and decisive, generally 30-42px, with one cobalt keyword tspan when useful. Body copy is 22-28px with short lines and enough tspan line spacing for Korean glyphs. Keep numbers with their units and wrap Korean at phrase boundaries; widen the content zone before reducing type size, respecting the runtime floor. Use deep navy for small labels on white or pale-blue fields; sky blue is a structural accent, not small text. Recurring eyebrows use only the supplied project or section name. Keep all meaningful text as explicit SVG text/tspan elements, never rasterized."
    - "Content slides use a small top-left eyebrow text element with the supplied project or section name and a thin cobalt horizontal line element. Add a restrained footer or page marker only when it helps continuity, staying clear of the reserved system footer area. Several slides may use a dark navy evidence rail (solid rect) occupying roughly 18-24% of the right edge, but do not force it onto every slide. Cover and section slides may use translucent-looking cool-gray corner polygons (built from solid low-opacity fills, not blend or filter effects) derived from the reference family. Build content zones from compact numbered sections, strong cobalt directional bands (rect/polygon), and white or light-gray fields."
    - "Draw process rails and architecture as explicit SVG primitives: cobalt arrows built from polygon/path (M/L/H/V/Z, no curves), navy text labels, pale-blue rect group zones, and violet circle stage dots. Connectors must visibly terminate at their nodes and be drawn before (so they stay behind) the labels. Use thin line elements and suggest depth with stepped solid-color offset shapes rather than shadows; avoid oversized rounded tiles."
brief: |-
  MOOD
  Create a Korean enterprise SI proposal that visibly belongs to the retained DevAX proposal family. The deck should feel like a polished Korean B2B proposal: information-rich but ordered, formal but visually active. The reference images are the authoritative visual grammar only. Write new audience-facing content for the current request; never copy reference wording, project claims, client names, or measurements unless they are supplied in the request.

  PALETTE
  Use a near-white #F7F9FC canvas with white #FFFFFF content zones and cool gray #F2F6FA architectural corner planes. Use cobalt blue #1677E8 as the primary signal, deep navy #102A52 for evidence rails and conclusions, sky blue #64B5F6 for supporting structure, and violet #7157E8 only for numbered stages.
  Use the original palette with strong text/background contrast. Pale tints serve as surfaces, not low-contrast body text; differentiate critical states with wording or shape as well as color.

  TYPOGRAPHY
  Use Pretendard with Noto Sans KR as the Korean fallback. Titles are compact and decisive, generally 30–42px, with one cobalt keyword when useful. Body copy is 22–28px with short lines and enough leading for Korean glyphs. Keep numbers with their units and wrap Korean at phrase boundaries; widen or rebalance the content zones before reducing type, and respect the active typography floor. Use deep navy for small labels on white or pale-blue fields; sky blue is a structural accent rather than small text. Recurring eyebrows use only the supplied project or section name. Keep all meaningful text editable HTML.
  At 1280x720, use the Korean-safe stack "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif for Korean text. Body text should normally be 22-28px; captions and source notes preferably at least 16px. The hard minimum for every visible text run is 9.5pt (12.667px). Recompose, shorten or split content before reducing readability; never shrink below this floor. Preserve any genre-specific display-face accents only where Korean fallback remains clear.

  LAYOUT SYSTEM
  Work on a disciplined 16:9 grid with 48–64px safe margins. Favor broad business-infographic compositions over generic card dashboards. Use one dominant composition per slide, drawn from a left-to-right process, an explanation and evidence split, a central architecture with bounded domains, a comparison with a dark evidence rail, or a staged implementation matrix. Treat 60/40 as a starting proportion, giving long Korean evidence labels sufficient width. Reserve separate title, content, and footer space; align every label, connector, and panel to the grid. Reflow crowded material within the allocated slide and preserve required evidence and the requested slide count. Vary compositions with the argument while keeping header and footer anchors stable.
  Preserve the original SI proposal identity while letting the evidence choose its shape. Use an open system boundary for architecture, an aligned table for requirements and a spare sequence for delivery. Alternate technical depth with business implications; a connector network is useful only when relationships must be explained. These are free compositional choices driven by content, never fixed layouts or required slots. Give the main evidence generous space and vary visual density across the deck.

  SIGNATURE ELEMENTS
  Content slides use a small top-left eyebrow with the supplied project or section name and a thin cobalt horizontal rule. Add a restrained footer or page marker only when it helps continuity. Several slides may use a dark navy evidence rail occupying roughly 18–24% of the right edge, but do not force it onto every slide. Cover and section slides may use translucent cool-gray corner planes derived from the reference family. Build content zones from compact numbered sections, strong cobalt directional bands, and white or light-gray fields. Draw process rails and architecture as editable native HTML or SVG, using cobalt arrows, navy labels, pale-blue group zones, and violet stage dots. Connectors must visibly terminate at their nodes and stay behind labels. Use thin lines and small shadows, and avoid oversized rounded tiles.
  Keep the existing cobalt, light blue and violet hierarchy: primary solution, supporting context and a carefully named distinction. Make system boundaries and dependency lines do actual explanatory work; retain all original brand references and provenance.

  DATA VISUALIZATION
  Tables and charts should look proposal-authored rather than application UI: compact headers, clear units, direct labels, pale-blue row grouping, and a dark navy conclusion strip when a conclusion is supported. Right-align numeric columns, keep units and precision consistent, and leave room for wrapped row labels and the supplied source or period. Bars start at zero and comparable series share a scale; use lines for ordered time series. A companion chart is optional and must add a relationship that the table alone does not convey. Highlight only the figures that support the slide's claim. Never invent metrics, sources, dates, owners, or implementation commitments; use a qualitative comparison or ordered sequence when the source is qualitative.
  Distinguish current state, proposed state and assumptions. Map requirements to acceptance evidence without inventing coverage percentages. In plans, show dependencies and responsible roles only when known; an architecture arrow must name a data flow or interaction rather than imply technical completeness.

  IMAGE DIRECTION
  Favor credible enterprise workspace, infrastructure, or professional cutouts and restrained system diagrams. Do not use cute robot mascots, glossy 3D objects, generic browser-window piles, or full-bleed stock photography. Images must support the proposal claim and remain subordinate to the information hierarchy.

  SLIDE ARCHETYPES
  cover: Place the supplied proposal title in the spacious central-left field with one supported business outcome below. Add client and date metadata only when supplied, preserving the cool-gray corner geometry and cobalt and navy emphasis without copying reference text.
  agenda: Align the actual chapter names in a single list with violet numerals and thin cobalt rules. Use the available width for long Korean names and show no invented chapter descriptions or page references.
  section: Open a chapter on the cover's translucent cool-gray corner geometry, carrying its supplied section label with one cobalt keyword and no dense body copy.
  content: Use an explanation and evidence split with the main infographic on the wider side, or align comparison options against the same criteria beside a dark navy evidence rail. A process may use violet stage dots and short navy labels, with the stage count determined by the supplied sequence.
  architecture: Center a hub only when the source describes a hub; otherwise use aligned tiers. Group the actual domains in pale-blue zones with navy labels and cobalt connectors that terminate at node boundaries. Keep connector lanes outside text boxes, distinguish direction only when known, and never pad the system to a fixed number of modules.
  data: Give one proposal-authored table or chart the main field, group rows in pale blue, and highlight the supporting figures. Add a companion chart only when it adds information and fits beside readable table columns; keep the conclusion strip clear of source notes.
  timeline: Arrange the supplied phases against workstreams as a numbered implementation matrix or a process rail with violet stage markers. Use proportional date bands only when dates and durations are supplied; otherwise show sequence without implying elapsed time. Place deliverables and owners only where the source identifies them.
  closing: Close on the same spacious cool-gray corner geometry as the cover with one navy conclusion line and a restrained supporting line beneath it, introducing no new figures.
  Additional forms — current-to-target system comparison; requirement-to-evidence table; integration flow with labeled boundaries; milestone sequence with an explicit dependency; delivery-risk decision with a documented mitigation.

  AVOID
  Avoid the generic default-blueprint look, sparse title-and-four-card pages, detached UI widgets, large empty white fields without purpose, thick borders, excessive rounded rectangles, gradients used as decoration, tiny Korean copy, copied source wording, and claims of template fidelity without comparing a newly generated product result.
  Avoid fictional architecture components, unlabeled bidirectional arrows, vendor-certification claims and shrinking requirement tables to fit.
