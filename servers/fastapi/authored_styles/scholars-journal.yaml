brief: >-
  MOOD: Create the calm authority of a peer-reviewed journal spread: tactile,
  measured, and intellectually generous. The design should reward close reading and
  make sources feel integral to the argument.

  PALETTE: Use paper cream (#F6F1E7), deep editorial ink (#25211D), oxblood (#7C2D12),
  muted parchment (#B8A98A), and warm gray (#6B6258). Let oxblood mark only key
  annotations, issue labels, and important citations.
  Use the original palette with strong text/background contrast. Pale tints serve as surfaces, not low-contrast body text; differentiate critical states with wording or shape as well as color.

  TYPOGRAPHY: Pair a dignified display serif for titles with a highly readable serif
  or neutral sans-serif for body copy. Use hanging citation labels, modest italics for
  publication titles, and tabular figures for dates and statistics. Choose available
  fonts with complete Korean glyph coverage; use upright Korean text and natural
  phrase breaks. Reserve separate lines for equations and allow room for scripts
  and fractions. Widen columns or reflow evidence before reducing type, preserving
  the runtime typography floor.
  At 1280x720, use the Korean-safe stack "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif for Korean text. Body text should normally be 22-28px; captions and source notes preferably at least 16px. The hard minimum for every visible text run is 9.5pt (12.667px). Recompose, shorten or split content before reducing readability; never shrink below this floor. Preserve any genre-specific display-face accents only where Korean fallback remains clear.

  LAYOUT SYSTEM: Compose with a magazine-like baseline grid, two text columns when
  needed, generous outer margins, and deliberate white space around quotations. Keep
  a clear reading order and never split a citation from its claim. Keep a distinct
  gutter between columns and a source strip within the outer safe margins. Move
  long quotations to a single wide column and retain supplied attribution; do not
  squeeze bibliography text into decorative margins.
  Let the warm-paper editorial voice frame a clear research argument. Balance a compact proposition with a broad figure, excerpt or evidence comparison; use columns only when reading order remains obvious. Alternate close reading, comparative evidence and reflective synthesis with generous margins. These are free compositional choices driven by content, never fixed layouts or required slots. Give the main evidence generous space and vary visual density across the deck.

  SIGNATURE ELEMENTS: Use folio numbers, running heads, quiet hairlines, pull quotes,
  bibliography-style source strips only when they aid navigation or attribution.
  Avoid repeated running heads and issue-label capsules without actual publication
  context; never invent an author, issue number, date, or citation.
  Use rust rules and restrained serif accents for intellectual cadence, keeping Korean explanations in a readable sans-serif. Citation details belong beside their claims when available; running heads and publication marks require real supplied metadata.

  DATA VISUALIZATION: Favor editorial tables, evidence matrices, annotated timelines,
  and restrained line charts. Use ink-first marks with one oxblood highlight; include
  source, period, and definition notes next to the visualization when available.
  Evidence matrices distinguish reported findings, interpretation, and missing
  information; a blank cell must not imply a negative result. Use shared scales for
  numerical comparisons and retain uncertainty from the source. Wrap long study
  names in padded rows rather than hiding them in abbreviations.
  Use small-multiple comparisons only with common scales and explicit categories; otherwise prefer a single well-annotated figure or evidence table. Separate quotation, paraphrase and interpretation. Do not invent authors, publication years, page numbers or source counts.

  IMAGE DIRECTION: Choose archival scans, book details, research environments, and
  monochrome documentary photography. Crop with purpose; use captions that identify
  creator, collection, or source.

  SLIDE ARCHETYPES: cover: an editorial title with supplied author and date, using a
  journal masthead only when the source actually belongs to that publication;
  content: a two-column argument with a pull quote or source margin; data: a compact
  evidence table with an editorial annotation; timeline: dated publication or debate
  milestones on a ruled baseline using supplied dates; section: a wide section title
  with one oxblood rule; agenda: a contents-style list of supplied themes; architecture:
  a conceptual framework on an editorial grid with named relationships and connector
  corridors clear of citations, marking inferred links as hypotheses; closing: a final thesis with selected references and
  discussion prompt.
  Additional forms: argument paired with a figure; genuine source excerpt with close reading; comparative evidence table; concept genealogy with supported links; synthesis that makes a limitation part of the conclusion.

  AVOID: Avoid glossy stock-photo hero images, loud color blocks, justified walls of
  tiny text, fake citations, novelty typefaces, and decorative elements that mimic
  scholarly authority without carrying information.
  Avoid fabricated journal identity, tiny footnotes, sepia charts with indistinguishable series and ornamental quotation marks without quoted evidence.
