brief: |-
  MOOD
  야간 무대의 대담한 낙관과 벤처 규모의 야심. 한 장면마다 하나의 강한 투자 논지를 남긴다.

  PALETTE
  거의 검은 자주 #0B0618과 밝은 라일락 #F7F0FF를 기본으로 한다. 마젠타 #FF3CAC를 영웅 강조에, 보라 #784BFF와 전기 시안 #00E5FF를 빛의 깊이와 보조 지표에 사용한다.

  TYPOGRAPHY
  넓고 무거운 산세리프 제목을 크게 사용하며, 숫자는 제목과 같은 무게로 처리한다. 본문은 작은 라일락 텍스트로 절제하고 한 슬라이드의 문장을 짧게 유지한다.

  LAYOUT SYSTEM
  중앙의 큰 주장 또는 숫자를 중심으로, 가장자리에는 작은 근거를 배치한다. 하단에서 올라오는 빛의 수평선, 큼직한 빈 공간, 겹치지 않는 소수의 요소로 무대감을 만든다.

  SIGNATURE ELEMENTS
  마젠타-보라 네온 수평선, 부드러운 광륜, 크게 확대한 시장 수치, 별처럼 작은 시안 포인트를 사용한다. 유리 프리즘 패널, 녹색 터미널, 촘촘한 카드 격자는 사용하지 않는다.

  DATA VISUALIZATION
  시장 규모의 동심 원, 강조된 단일 성장 곡선, 큰 비율 숫자, 스포트라이트처럼 한 항목만 밝힌 비교 막대를 사용한다. 모든 값이 동시에 빛나지 않게 한다.

  IMAGE DIRECTION
  어두운 도시의 빛, 미래적인 제품 실루엣, 무대 조명, 대담한 창업자 초상을 사용한다. 사진은 검은 여백으로 녹아들고 마젠타 또는 보라 조명이 한 방향에서 들어온다.

  SLIDE ARCHETYPES
  cover: 검은 배경, 매우 큰 비전 문장, 하단 네온 수평선 하나로 시작한다.
  content: 중앙 주장을 크게 두고 주변에 세 개 이하의 짧은 증거를 띄운다.
  data: 시장 또는 성장 수치 하나를 압도적으로 크게, 보조 비교는 희미하게 처리한다.
  timeline: 어두운 지평선 위에 상승하는 3~5개 단계와 짧은 투자 이정표를 둔다.
  closing: 기억할 한 문장과 작은 시안 연락 수단을 어두운 여백에 둔다.

  AVOID
  무지개 스펙트럼, 반투명 유리 카드 다발, 녹색 코드 비, 흰색 보고서 배경, 모든 텍스트에 네온 외곽선.
