id: neon-venture
name: 네온 벤처
description: 검은 밤과 보라·마젠타 네온의 대비로 큰 시장 기회와 대담한 성장 서사를 압축하는 벤처 피치 스타일입니다.
category: technology
tags:
  - 투자 유치
  - 성장 전략
  - 시장 기회
use_cases:
  - 벤처 캐피털 피치
  - 시리즈 투자 발표
  - 성장 내러티브
