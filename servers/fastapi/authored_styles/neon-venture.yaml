svg_overrides:
  # LAYOUT SYSTEM: the composition line is html-only only for the shared
  # "freely authored HTML/CSS" boilerplate; the intent (single focal arena,
  # alternation, observation limit) is restated below for SVG. Glow itself
  # has no SVG filter equivalent here, so it is expressed as layered
  # lower-opacity solid shapes instead (per SVG_AUTHOR_RULES: no filters).
  resolved_sections: [LAYOUT SYSTEM]
  layout_hints:
    - "Build a focused arena with one large comparison or experiment path and a supporting SVG text zone, not an array of glowing cards. Approximate any glow with two or three layered, slightly offset, lower-opacity solid-color shapes behind the focal object rather than a filter or gradient. Alternate a vivid launch proposition slide, a quiet dark data slide and an open milestone scene across the deck. Limit neon emphasis to one focal object per slide; keep supporting content to three short SVG text observations. Compose freely from SVG primitives rather than a fixed slot grid."
brief: |-
  MOOD
  야간 무대의 대담한 낙관과 벤처 규모의 야심. 한 장면마다 하나의 강한 투자 논지를 남긴다.

  Treat neon as the energy of an experimental venture, with decisive content beneath the spectacle. The dark ultraviolet field should frame a legible hypothesis and evidence.

  PALETTE
  거의 검은 자주 #0B0618과 밝은 라일락 #F7F0FF를 기본으로 한다. 마젠타 #FF3CAC를 영웅 강조에, 보라 #784BFF와 전기 시안 #00E5FF를 빛의 깊이와 보조 지표에 사용한다.

  Preserve deep violet, magenta, electric purple and cyan. Use near-white for reading text and dark violet on bright highlight surfaces; neon edges are decoration, not the only boundary between data groups.

  TYPOGRAPHY
  한글 글리프를 지원하는 넓고 무거운 산세리프 제목을 사용하며, 숫자는 제목과 같은 무게로 처리한다. 본문과 출처는 밝은 라일락으로 선명하게 유지하고 긴 한글 제목은 의미 단위로 줄을 나눈다. 굵은 글자 주변 여백과 본문 행간을 먼저 확보하며 런타임 글자 크기 하한을 유지한다.

  Use a heavy modern sans-serif for a short headline and plain sans-serif for analysis; avoid outline-only text and condensed labels. All Korean text must resolve through a local stack including "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif. At a 1280x720 canvas, target body 22-28px and labels at least 16px; 9.5pt (12.667px) is the hard floor for every text run, including SVG, captions and sources. If text cannot fit, shorten with evidence intact or split the slide; never shrink below the floor.

  LAYOUT SYSTEM
  중앙의 큰 주장 또는 숫자에 인접한 정렬된 근거 영역을 둔다. 슬라이드 외곽 안전 여백과 하단 출처 공간을 확보하고 빛의 수평선은 텍스트 뒤를 피한다. 광륜은 시각 요소에만 적용하며 긴 근거는 넓은 열로 재배치한다.

  Build a focused arena with one large comparison or experiment path and a supporting text zone, not an array of glowing cards. Alternate a vivid launch proposition, a quiet dark data page and an open milestone scene. Limit neon emphasis to one focal object; keep supporting content to three short observations. These are flexible compositional directions for freely authored HTML/CSS, not fixed layouts, slots, Deck IR or a layout engine.

  SIGNATURE ELEMENTS
  마젠타-보라 네온 수평선, 부드러운 광륜, 크게 확대한 시장 수치, 별처럼 작은 시안 포인트를 사용한다. 유리 프리즘 패널, 녹색 터미널, 촘촘한 카드 격자는 사용하지 않는다.

  Use one electric ribbon, offset frame or luminous threshold line to mark the transition from hypothesis to test. Keep glow decorative and outside text edges; plain solid marks carry the numbers.

  DATA VISUALIZATION
  시장 규모 비교는 공통 척도의 막대와 직접 표기를 우선한다. 동심 원은 포함 관계 설명에만 사용하고 크기로 시장 규모를 암시하지 않는다. 성장 곡선은 제공된 시점별 수치로 그리며 실적과 전망을 선 모양과 라벨로 구분한다. 비율의 분모, 단위, 기간, 출처를 남기고 모든 비교값은 읽을 수 있는 밝기로 유지한다.

  Use cyan and magenta direct-labeled bars or a two-stage experiment comparison on a shared scale. Distinguish sample results, assumptions and targets explicitly. Keep zero baselines where required and never turn illustrative traction into a market claim.

  IMAGE DIRECTION
  어두운 도시의 빛, 미래적인 제품 실루엣, 무대 조명, 대담한 창업자 초상을 사용한다. 사진은 검은 여백으로 녹아들고 마젠타 또는 보라 조명이 한 방향에서 들어온다.

  Create one original abstract ribbon or orbit with clean SVG geometry. Do not require remote assets or copy a startup's product imagery; abstract art supports the experiment narrative.

  SLIDE ARCHETYPES
  cover: 검은 배경, 매우 큰 비전 문장, 하단 네온 수평선 하나로 시작한다.
  content: 중앙 주장을 크게 두고 주변에 세 개 이하의 짧은 증거를 띄운다.
  section: 짧은 투자 논지 제목과 낮은 네온 수평선으로 전환한다.
  agenda: 제공된 피치 주제를 좌측 기준선에 정렬하고 현재 주제 하나만 마젠타로 강조한다.
  architecture: 제품의 핵심 구성요소를 밝은 라벨로 구분하고 빈 연결 통로에 방향선을 배치한다. 긴 한글 라벨은 노드 밖 독립 영역에 둔다.
  data: 근거가 있는 시장 또는 성장 수치를 강조하고 비교값과 출처도 선명하게 유지한다.
  timeline: 제공된 투자 이정표를 수평선 위에 배치하고 확정·계획 상태를 표기한다. 임의의 상승 경로나 날짜를 만들지 않는다.
  closing: 기억할 한 문장과 제공된 연락 수단을 시안으로 강조하며 미제공 연락처는 생략한다.

  Compose freely — launch hypothesis with one evidence point; two-variant experiment comparison; milestone path with decision gates; product mechanism close-up; traction evidence with source and denominator; risk-versus-test ledger; concise next experiment.

  AVOID
  무지개 스펙트럼, 반투명 유리 카드 다발, 녹색 코드 비, 흰색 보고서 배경, 모든 텍스트에 네온 외곽선.

  Do not invent claims, measurements, quotations, citations or provenance. Keep illustrative data visibly labeled and supplied evidence traceable. Avoid repeating the same composition throughout a deck; alternate the narrative scenes above while retaining this style's visual identity. Keep all original reference images and their provenance intact.
