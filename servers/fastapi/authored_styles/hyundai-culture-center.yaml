brief: |-
  MOOD
  Create a thorough, execution-ready Korean SI proposal that reads as if it were prepared for a retail and cultural-center client review board. The tone is competent and exhaustive rather than promotional: every slide answers one requirement with visible structure, and the reviewer should be able to trace the argument from chapter, to sub-clause, to evidence. Density is acceptable when alignment and grouping keep it legible.

  PALETTE
  Use off-white #F9F9F9 as the working canvas with white #FFFFFF panels floating on it. Use emerald #08916E for the top header band, chapter markers, and keyword emphasis, and teal #219F88 for table header rows and grouped-label fills. Use deep teal #00828E for schedule rails, progress bands, and chart accents. Use navy #002060 and cobalt #1B469C for system diagrams, module boxes, and hierarchy labels, with pale blue #E0F3FF and #CCECFF as information-zone fills and neutral #EAEDF2 for supporting panels. Cover and section slides invert to a near-black green field #00140E graded into deep green. Keep body text near-black #1D1D1B. Reserve a single warm amber accent for one status or priority marker per slide.
  Use the original palette with strong text/background contrast. Pale tints serve as surfaces, not low-contrast body text; differentiate critical states with wording or shape as well as color.

  TYPOGRAPHY
  Use Noto Sans KR throughout. Set slide titles as short numbered clauses on two lines when the supplied structure supports them: the chapter or sub-clause number and label first, then the specific topic. Reserve the full title height before laying out evidence. Use bold compact headlines for the claim above a diagram, and color only the decisive keyword in emerald. Keep Korean body copy left-aligned with natural phrase breaks and comfortable leading; do not compress glyphs or reduce type below the active typography floor to fit dense evidence. Use near-black or navy for small meaningful text on light fields. Align numerals in tables and use IBM Plex Mono only for identifiers, version tags, and technical metadata. All meaningful text must remain editable HTML rather than being baked into generated images.
  At 1280x720, use the Korean-safe stack "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif for Korean text. Body text should normally be 22-28px; captions and source notes preferably at least 16px. The hard minimum for every visible text run is 9.5pt (12.667px). Recompose, shorten or split content before reducing readability; never shrink below this floor. Preserve any genre-specific display-face accents only where Korean fallback remains clear.

  LAYOUT SYSTEM
  Use a wide corporate canvas. Content slides carry a persistent thin emerald header band with the supplied chapter name on the left and project name on a darker right-hand tag. Directly beneath it, place the clause title in black on the plain canvas. Reserve a slim footer strip for the page number and any supplied brand or author mark; omit unavailable identity fields. Cover, section, and closing pages follow their own spacious archetypes. In a source restyle, the source page's header and numbering contract takes precedence. Keep the content inside one clean rectangle between title and footer, using aligned panels or one dominant diagram with a supporting column only when it fits. Keep stable outer margins, explicit gutters, and source-note space; widen dense table columns before adding nested panels or reducing type. Preserve required evidence within the requested slide count.
  Preserve the reference-derived Korean SI proposal language and its original imagery while making the page answer a concrete culture-center service question. Alternate customer-service evidence, operating-process views and delivery decisions. Keep a wide quiet field around the principal result; do not turn every VOC or service slide into a system map. These are free compositional choices driven by content, never fixed layouts or required slots. Give the main evidence generous space and vary visual density across the deck.

  SIGNATURE ELEMENTS
  Use the emerald header band with a dark chapter tag, numbered clause titles, rounded white panels with hairline borders, and dark navy tab labels. Give small table-header text a navy or near-black foreground on teal, reserving white type for sufficiently dark header fills. Use subtle row rules, pale-blue information zones, and connector lines with small square nodes. Module boxes may be hexagonal or rounded, but keep each diagram consistent and reserve clear connector lanes outside text. An emerald keyword may emphasize the supported takeaway without repeating a separate slogan. Cover and section slides use a soft rounded folder-tab shape over the dark green gradient with a small teal marker beside the chapter numeral.
  Use the existing green/teal identity for the main service argument and the established blue accents for supporting technical structure. Preserve the distinctive rules, restrained tables and branded references, choosing only the motifs relevant to the slide's actual content.

  DATA VISUALIZATION
  Favor comparison tables with teal header rows, figure tables, role and responsibility matrices, and horizontal Gantt rails when the source supplies a dated schedule. Right-align numbers, keep units and precision consistent, allow Korean row headers to wrap, and retain supplied periods and source notes. A companion bar chart is optional; start bars at zero and use the same scale for comparable values. Direct-label important values and use teal intensity for hierarchy together with text labels. Date columns and phase lengths must reflect supplied dates; show milestone diamonds, a current-date line, owners, and deliverables only when grounded in the input. An undated plan uses an ordered phase sequence without invented month lengths or progress. Charts, tables, and values must be editable HTML or inline SVG.
  Keep observed VOC, interpretation and proposed improvement separate. Show the source period and denominator for issue frequency; distinguish counts from percentages and prioritization from measured impact. Use direct comparison bars or a concise evidence table before reaching for architecture or Gantt diagrams.

  IMAGE DIRECTION
  Use restrained supporting imagery only when it carries the claim: abstract technology fields behind a headline, device or interface frames beside a UX point, and muted photographic bands as section texture. Prefer original vector-like diagrams over stock photography. Reference images define composition, density, and visual hierarchy only; never reproduce their wording, client names, logos, company marks, watermarks, photographs of people, financial figures, or exact object arrangement.

  SLIDE ARCHETYPES
  cover: Place the supplied project title left-aligned in white on the dark green gradient. Include client, date, and author metadata only when provided, leaving space for a long Korean title without adding content-slide header furniture.
  agenda: Present the chapter list as a single left-aligned column on the near-white canvas, each row a large emerald numeral beside its chapter name, separated by hairline rules, with generous leading and no descriptions.
  section: Fill the slide with the near-black green field, seat a soft rounded folder-tab shape at the left carrying the chapter numeral in teal, and set the chapter name large in white beside it. A short list may contain actual chapter topics, with readable light text; include page references only when known.
  content: Lead with one bold claim line above the field, then combine a compact grouped block on the left with a labeled evidence list on the right, closing with a short takeaway.
  architecture: Use one system map with tiered zones for the channels, services, modules, and data actually described in the input. Route orthogonal connectors to node boundaries without crossing labels. Reserve a separate supporting column only when needed; never place callouts over the map or invent missing system layers.
  data: Give one readable figure table with a teal header row the main field. Add a companion chart only when it reveals a useful comparison and fits without shrinking the table; place a supported interpretation and source note below.
  timeline: Use a horizontal date grid with swimlanes for supplied workstreams and aligned milestones when dates exist. Use numbered phase columns for an undated plan. Show a critical or current line only when the input identifies it, keeping milestone labels clear of bars.
  closing: Present a single centered closing line in white on the dark green field, with the supplied author mark beneath it when available.
  Additional forms — VOC frequency with the source scope; customer friction-to-improvement pairing; service response comparison; requirement-to-acceptance evidence table; phased delivery with one dependency and its customer consequence.

  AVOID
  Avoid decorative gradients inside the content field, playful consumer styling, mismatched icon sets, drop shadows on text, unlabeled arrows, tables without header contrast, more than one amber emphasis per slide, oversized logos, copied reference wording or brand marks, invented client or personnel data, text baked into generated images, and claims unsupported by the visual evidence. Prefer short paragraphs, but preserve required source wording by reallocating space rather than deleting it to meet a line-count preference.
  Avoid fabricated customer quotations, invented Hyundai performance figures, unverified improvement claims and repeated module walls unrelated to the page's question.
