illustration:
  # STYLE ONLY: palette, medium and finish. Subject matter belongs to the
  # slide's own scene prompt. Naming motifs here ("module-and-connector system
  # maps", "gantt style schedule rails") described the picture rather than the
  # look, and since this text is appended to every scene it out-argued them:
  # each slide, whatever it was about, came back as the same wall of unreadable
  # diagrams.
  style_prompt: >-
    premium Korean corporate proposal illustration, near-white canvas,
    emerald green and deep teal with navy accents over pale blue tints,
    restrained flat vector finish, clean edges, generous whitespace,
    no logos, no watermark, no clip art,
    no photorealistic retail stock image
