brief: |-
  MOOD
  정밀하고 낙관적인 첨단성. 빛이 분해되고 다시 결합하는 느낌으로 복잡한 기술을 명료한 구조로 보이게 한다.

  PALETTE
  깊은 남색 #0B1020 위에 연한 청백 #EAF0FF를 올린다. 보라 #7C5CFF, 시안 #2DD4FF, 마젠타 #FF6BCB는 프리즘의 스펙트럼처럼 인접해 사용하되 한 요소 안에서만 자연스럽게 전환한다.

  TYPOGRAPHY
  제목은 넓은 자간의 기하학적 산세리프, 설명은 정돈된 산세리프를 쓴다. 얇은 대문자 영어 보조 라벨과 큰 숫자를 조합하되 글로우 효과로 글자 자체를 흐리지 않는다.

  LAYOUT SYSTEM
  비대칭 대각 축을 기준으로 텍스트와 시각 요소를 교차 배치한다. 반투명 패널은 두세 장만 겹치고, 카드의 사각 격자보다 넓은 어두운 공간과 빛의 방향으로 계층을 만든다.

  SIGNATURE ELEMENTS
  반투명 유리 면, 얇은 스펙트럼 테두리, 대각선 빛줄기, 모서리가 잘린 다각형을 사용한다. 네온 튜브, 터미널 코드, 형광 녹색 HUD는 사용하지 않는다.

  DATA VISUALIZATION
  보라-시안-마젠타의 연속 막대, 광선처럼 뻗는 방사형 비교, 투명 레이어의 아키텍처 다이어그램을 사용한다. 데이터는 어두운 배경에 흰색 값과 한 방향의 색 전환으로 읽히게 한다.

  IMAGE DIRECTION
  유리, 굴절, 정교한 하드웨어, 청색광이 비치는 연구 환경, 추상 광학 텍스처를 활용한다. 사진은 어두운 여백을 남기고 스펙트럼 광원과 조화를 이룬다.

  SLIDE ARCHETYPES
  cover: 어두운 남색에 대각 스펙트럼 면 하나와 넓은 제목을 둔다.
  content: 한쪽의 프리즘 패널 위 설명과 반대쪽의 구조 이미지 또는 다이어그램을 둔다.
  data: 흰색 수치와 스펙트럼 진행 막대로 하나의 비교 축을 강조한다.
  timeline: 빛이 이동하는 대각선 경로에 4개의 반투명 이정표를 놓는다.
  closing: 어두운 여백에 짧은 결론과 작게 빛나는 보라 점을 남긴다.

  AVOID
  형광 녹색, 전체 화면 마젠타, 촘촘한 격자, 둥근 파스텔 카드, 과한 유리 효과, 무작위 무지개 장식.
