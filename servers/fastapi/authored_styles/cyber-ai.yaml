brief: |-
  MOOD
  신뢰할 수 있고 통제 가능한 지능. 사이버 감성은 장식이 아니라 시스템의 흐름과 상태를 읽게 하는 정밀함으로 표현한다.

  PALETTE
  심해 녹색 #07130F 위에 청백 #DDFCF4를 둔다. 민트 #35F2C2는 활성 흐름, 시안 #35B9FF는 정보 계층, 산성 연두 #A6FF3F는 주의가 필요한 하나의 상태에만 사용한다.

  TYPOGRAPHY
  제목은 단단한 산세리프, 라벨·시간·모델명은 작은 모노스페이스를 사용한다. 코드 블록을 장식으로 남발하지 말고, 숫자와 상태 레이블은 명확한 정렬로 읽힌다.

  LAYOUT SYSTEM
  좌측에는 설명 계층을, 우측에는 파이프라인이나 상태 보드를 둔다. 얇은 구분선, 정교한 정렬, 넓은 검은 공간을 사용하되 전체 화면 격자를 배경 장식으로 만들지 않는다.

  SIGNATURE ELEMENTS
  연결된 노드, 흐르는 신호선, 작은 상태 칩, 조준점 같은 원형 마커, 미세한 스캔 라인을 사용한다. 프리즘 광학, 보라 네온 지평선, 굵은 라임 격자는 사용하지 않는다.

  DATA VISUALIZATION
  모델 파이프라인, 입력-추론-검증 흐름, 신뢰도 게이지, 시간별 이벤트 스트립을 사용한다. 활성 경로만 민트로 밝히고 나머지 구조는 낮은 대비로 유지한다.

  IMAGE DIRECTION
  미세 구조, 서버와 센서, 데이터의 흐름을 암시하는 매크로 질감, 어두운 실험실의 실물 장비를 사용한다. 인간형 로봇 클리셰나 녹색 매트릭스 비는 피한다.

  SLIDE ARCHETYPES
  cover: 심해 녹색 바탕에 모델 또는 시스템명을 크게, 작은 상태 마커를 곁들인다.
  content: 왼쪽의 명료한 설명과 오른쪽의 연결된 세 단계 시스템 흐름을 둔다.
  data: 신뢰도·처리량·지연시간 중 한 지표를 활성 신호선과 직접 수치로 보여 준다.
  timeline: 신호가 통과하는 수평 파이프라인에 수집·추론·검증·배포 단계를 둔다.
  closing: 운영 원칙 또는 다음 통제 항목을 상태 칩 세 개 이하로 정리한다.

  AVOID
  장식용 소스 코드, 글리치 텍스트, 과도한 녹색, 유리 카드 콜라주, 눈에 띄는 배경 격자, 암호 해독 영화 연출.
