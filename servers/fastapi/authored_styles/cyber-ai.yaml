svg_overrides:
  resolved_sections: [LAYOUT SYSTEM, IMAGE DIRECTION]
  layout_hints:
    - "Pair one simple trust-boundary diagram with a clear narrative text column. Alternate a boundary map, a workflow study and a flat verification ledger across pages. Each map uses three to five nodes and one highlighted path; move exception detail to a separate reading page. Treat these as compositional directions scaled to the pinned canvas, not fixed coordinates."
  common_guidance:
    - "Build diagrams from permitted SVG primitives only: nodes as rect, circle or polygon; connections as line or straight-segment polyline; the one highlighted path in the accent colour at a heavier stroke, all others muted."
    - "Suggest the luminous protective field and refracted glass forms with two or three stacked solid shapes of decreasing opacity around the protected node, never with gradients, filters or blur. Draw isometric systems and cutaways with polygon faces in three flat tones of one hue for top, left and right planes."
    - "Keep every illustration tied to the slide's claim. Do not reproduce wording, logos, watermarks or the exact object arrangement of a reference image."
brief: |-
  MOOD
  Create an optimistic near-future security platform aesthetic: precise, luminous, calm, and highly engineered. The deck should feel like a premium technology keynote with consulting-grade information design, not a generic corporate template.

  Keep the optimistic light security-platform identity: calm control, visible trust boundaries and an understandable human decision.

  PALETTE
  Use a soft ice-white canvas #F4F7FA with near-black #171A20 typography. Organize systems with muted zone colours: blue #4F86D9, warm coral #ECA064, mint #67B989, and restrained prism lavender #B8A7E8. Use translucent spectral gradients only as a focal light effect, never as decoration across the whole slide.

  Preserve the light cool canvas with blue, warm orange, green and lavender role accents. Use dark ink text over pale planes; color never substitutes for a control state label.

  TYPOGRAPHY
  Use Noto Sans KR for Korean headings and body copy, with very bold compact headlines and phrase-based line breaks. Reserve IBM Plex Mono for Latin IDs, metrics, and stage markers; Korean system labels stay in Noto Sans KR. Allow bold-label padding and a separate line for long IDs before reducing text size. Preserve the runtime typography floor.

  Use clean sans-serif hierarchy with a large short title, readable node labels and generously spaced explanations. Reserve mono styling for short technical identifiers. All Korean text must resolve through a local stack including "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif. At a 1280x720 canvas, target body 22-28px and labels at least 16px; 9.5pt (12.667px) is the hard floor for every text run, including SVG, captions and sources. If text cannot fit, shorten with evidence intact or split the slide; never shrink below the floor.

  LAYOUT SYSTEM
  Build asymmetric editorial compositions with a clear reading path: a strong narrative block on one side and a large engineered visual on the other. Keep an outer safe margin and a clear gutter between narrative and diagram; reserve label bands outside the isometric volumes. Route thin connectors through empty corridors, ending at explicit ports without crossing labels. Prefer one integrated system scene or diagram over collections of unrelated cards.

  Pair a luminous but simple trust-boundary diagram with a clear narrative column. Alternate a boundary map, a workflow study and a flat verification ledger. Use three to five nodes and one highlighted path per map; move exception detail into a separate reading page. These are flexible compositional directions for freely authored HTML/CSS, not fixed layouts, slots, Deck IR or a layout engine.

  SIGNATURE ELEMENTS
  Use translucent prism volumes, softly refracted light, isometric infrastructure clusters, connected agent nodes, layered security zones, and small precise labels. Visuals should feel dimensional and tactile while remaining clean enough for an executive audience.

  Use translucent-looking pale planes, rounded technical junctions and a few orbit-like connectors with a defined meaning. Treat each boundary as a labeled region, not a decorative glass card.

  DATA VISUALIZATION
  Use bars or dot plots on shared scales for quantitative comparison. Segmented rings require an explicit whole and exhaustive parts; gauges require a supplied minimum, maximum, and value. Keep dimensional prisms and pyramids for conceptual structure, never magnitude. Plot risk curves only from supplied observations or explicitly identified models, with axes, units, timeframe, and source. Direct-label values and retain a compact legend when necessary to decode domains.

  Distinguish proposed controls, measured observations and unresolved risks. A flow diagram should name the input, decision point and human review path. Compare supplied latency or detection metrics on plain scales; never invent security scores, certifications, threat counts or model capabilities.

  IMAGE DIRECTION
  Favor original inline-SVG or CSS-built isometric systems, architectural cutaways, luminous protective fields, and refracted glass forms. Keep the illustration tightly related to the slide claim. Do not reproduce any wording, logo, watermark, or exact object arrangement from a visual reference.

  Use original soft geometric SVG system art on light surfaces, with one consistent perspective. Illustrative shields or abstract tokens must not masquerade as certification marks. Retain all reference-image provenance.

  SLIDE ARCHETYPES
  cover: Oversized Korean title on the left with one luminous prism or protected isometric ecosystem occupying the right half.
  content: A concise claim paired with one integrated process, loop, or before-and-after transformation scene.
  section: One section claim and a cropped prism motif, with clear space for the title.
  agenda: An aligned list of the supplied topics, using small zone-colour markers without implying system connections.
  architecture: A central multi-agent or platform map with clearly separated colour-coded domains, named boundary crossings, and arrows only in documented directions. Move long labels into aligned external bands.
  data: One dominant comparison with direct values and short interpretation labels; use rings or gauges only when the source defines their denominator or bounds.
  timeline: A horizontal incident flow or roadmap using the supplied stages and dates. Distinguish observed events from planned stages with labels; colour alone must not imply completion.
  closing: A minimal vision statement with one memorable luminous protection symbol and a clear next action.

  Compose — trust-boundary overview; request-to-review sequence; control/evidence/limitation ledger; measured baseline comparison; exception path diagram; human decision handoff; calm summary with explicit open risks.

  AVOID
  Avoid dark hacker-terminal clichés, matrix rain, neon-on-black overload, generic card grids, stock photography, repetitive rounded rectangles, floating icons without relationships, tiny labels, and decorative complexity that competes with the message.

  Do not invent claims, measurements, quotations, citations or provenance. Keep illustrative data visibly labeled and supplied evidence traceable. Avoid repeating the same composition throughout a deck; alternate the narrative scenes above while retaining this style's visual identity. Keep all original reference images and their provenance intact.
