brief: |-
  VISUAL DIRECTION
  - Compose a calm, tactile presentation inspired by vellum paper, natural materials, and quiet editorial craft.

  LAYOUT
  - Use generous breathing room, sparse compositions, fine dividers, and carefully balanced text blocks.
  - Let one meaningful object, quotation, or figure carry each slide whenever possible.

  TYPOGRAPHY
  - Use dark ink typography with measured scale, relaxed leading, and understated labels.

  COLOR AND DATA
  - Work within warm neutrals, muted brown details, and soft tonal contrast without simulated texture noise.
  - Keep charts light and precise with hairline axes, direct labels, and ample negative space.

  AVOID
  - Avoid saturated colors, crowded dashboards, heavy borders, glossy effects, and repeated dense cards.
