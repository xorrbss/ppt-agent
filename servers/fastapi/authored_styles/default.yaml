brief: |-
  MOOD
  Create a clear, versatile consulting aesthetic with calm confidence, generous whitespace, and a practical focus on the audience's next decision.

  PALETTE
  Build from cool white #F8FAFC, white #FFFFFF, dark ink #0F172A, slate #64748B, and brand blue #2563EB. Reserve blue for key findings, actions, and navigational cues.
  Use the original palette with strong text/background contrast. Pale tints serve as surfaces, not low-contrast body text; differentiate critical states with wording or shape as well as color.

  TYPOGRAPHY
  Use confident sans-serif headings, highly readable body copy, concise labels, and tabular numerals with consistent scale relationships. Use an available Korean-capable sans-serif for Hangul; preserve natural word spacing and wrap long titles at phrase boundaries. Give body text open leading and enough width before shortening copy or changing the composition. Never compress tracking or reduce text below the runtime typography floor to make content fit.
  At 1280x720, use the Korean-safe stack "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif for Korean text. Body text should normally be 22-28px; captions and source notes preferably at least 16px. The hard minimum for every visible text run is 9.5pt (12.667px). Recompose, shorten or split content before reducing readability; never shrink below this floor. Preserve any genre-specific display-face accents only where Korean fallback remains clear.

  LAYOUT SYSTEM
  Use disciplined grids, strong hierarchy, and varied editorial compositions suited to each slide role. Align titles, evidence, and source notes to a shared left edge with clear outer margins. Use columns only when both sides remain readable; switch long Korean explanations to stacked rows with a narrow evidence column. Reserve space for sources before sizing the main content and keep the takeaway distinct from chart labels.
  Compose around a single sentence of useful insight, then give its strongest evidence the largest uninterrupted area. Use an open chart field, an offset text-and-figure pairing or a spacious comparison as the content requires. Alternate analytical pages with brief synthesis pages; use shared edges and generous breathing room to connect them. These are free compositional choices driven by content, never fixed layouts or required slots. Give the main evidence generous space and vary visual density across the deck.

  SIGNATURE ELEMENTS
  Use fine blue rules, compact section labels, restrained evidence panels, direct annotations, and one clear takeaway area per slide.
  Make the blue accent a precise editorial cue: one emphasized series, a short rule beside the conclusion, or one decisive value. Quiet gray comparison marks should remain legible; do not decorate every heading.

  DATA VISUALIZATION
  Render charts and tables simply with direct labels, visible units, periods, supplied source context, and minimal decoration. Use zero-baseline bars for magnitude, lines for ordered trends, and tables for exact or mixed-unit comparisons. Preserve shared scales for comparable series and distinguish actuals, targets, and estimates. Highlight the relevant evidence, including unfavorable results. Use only supplied values, owners, and dates; use a qualitative layout when numeric evidence is absent.
  Prefer directly labeled bars, a paired before/after dot plot or a simple variance bridge. State the unit, period and comparison basis beside the figure. Give the observed result and the proposed next step distinct labels; a recommendation must not masquerade as measured evidence.

  IMAGE DIRECTION
  Use clean, credible photography or simple contextual illustrations with one focal subject, neutral lighting, and enough clear space for the message.

  SLIDE ARCHETYPES
  cover: Pair a concise title and context line with one restrained blue rule or focused image.
  section: Set a chapter title beside a blue rule and one short transition statement on an open white field.
  agenda: Stack the supplied topics as aligned rows with a narrow number column and light separators; do not turn every row into a card.
  content: Present one claim with a two-column explanation and supporting evidence.
  architecture: Align components by responsibility or layer, place labels inside their own bounds, and route straight or orthogonal connectors through reserved gutters. Show only relationships supported by the input.
  data: Show one dominant chart with direct labels, source context, and a takeaway sentence.
  timeline: Arrange the supplied milestones on a clear horizontal sequence, switching to a vertical rail for long labels. Include owners or dates only when provided; distinguish sequence from elapsed time.
  closing: Summarize the supported decision and supplied next actions; include a checkpoint only when available rather than inventing an execution plan.
  Additional content-led possibilities — variance bridge with a one-line implication; ranked comparison with the chosen item annotated; before/after paired observations; dependency sequence with one bottleneck; open action summary tied to the preceding evidence.

  AVOID
  Avoid ornamental clutter, excessive cards, novelty type, competing accent colors, generic decoration, and conclusions that are not supported by the slide's evidence.
  Avoid equal emphasis on every fact, automatic four-card dashboards and blue accents used without a semantic role.
