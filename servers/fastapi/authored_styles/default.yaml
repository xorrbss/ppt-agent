brief: |-
  VISUAL DIRECTION
  - Create a clear, versatile consulting aesthetic with generous whitespace and restrained blue accents.

  LAYOUT
  - Use disciplined grids, strong hierarchy, and varied editorial compositions suited to each slide role.
  - Keep content blocks spacious, aligned, and easy to scan.

  TYPOGRAPHY
  - Use confident headings, readable body copy, and concise labels with consistent scale relationships.

  COLOR AND DATA
  - Build from white, cool gray, dark ink, and the brand blue as the primary accent.
  - Render charts and tables simply, with direct labels and minimal decoration.

  AVOID
  - Avoid ornamental clutter, excessive cards, novelty type, and competing accent colors.
