brief: |-
  MOOD
  관찰하고 연결하며 예상 밖의 패턴을 발견하는 호기심. 단정한 보고서보다 연구 벽면의 흥미로운 증거 묶음처럼 느껴져야 한다.

  PALETTE
  흐린 세이지 화이트 #F4F7F4와 짙은 남청 #182235를 기본으로 한다. 코발트 #2457D6는 연결과 주석, 앰버 #FFB21A는 발견의 순간, 연보라 #E7D8FF는 이미지 뒤의 부드러운 레이어에 사용한다.

  TYPOGRAPHY
  제목은 선명한 산세리프, 관찰 메모는 조금 작은 산세리프 또는 가벼운 이탤릭 느낌으로 구분한다. 캡션은 이미지 가까이에 두고, 텍스트 블록보다 짧은 주석의 밀도를 높인다.

  LAYOUT SYSTEM
  서로 다른 크기의 이미지·인용·관찰 카드를 비정형 콜라주로 배치하되 보이지 않는 기준선으로 읽는 순서를 지킨다. 한 장에는 중심 발견 하나와 주변 증거 세 개 이하만 담는다.

  SIGNATURE ELEMENTS
  파란 연결선, 원으로 둘러싼 발견, 앰버 밑줄, 작은 번호 주석, 종이 조각처럼 겹친 이미지 프레임을 사용한다. 다크 네온, 운영 대시보드, 규칙적인 카드 그리드는 사용하지 않는다.

  DATA VISUALIZATION
  주석이 달린 산점도, 이미지 표본이 섞인 매트릭스, 발견 순서를 보여 주는 점선 경로, 직접 메모가 붙은 단순 막대를 사용한다. 차트에도 관찰 문장을 가까이 둔다.

  IMAGE DIRECTION
  현장 사진, 제품 스크린샷, 자료의 세부 크롭, 물성 있는 사물, 다양한 관점을 보여 주는 연속 이미지를 사용한다. 사진은 완벽히 맞춘 스톡 컷보다 발견의 단서를 남긴다.

  SLIDE ARCHETYPES
  cover: 제목 옆에 발견을 암시하는 큰 이미지 크롭과 파란 주석 원 하나를 둔다.
  content: 중심 이미지 또는 인용을 두고 세 개 이하의 관찰 메모를 연결한다.
  data: 차트의 한 구간을 앰버로 표시하고 가까이에 해석 문장을 배치한다.
  timeline: 사진 조각과 번호 주석을 따라 발견 과정의 3~5개 장면을 연결한다.
  closing: 핵심 발견 세 가지를 이미지 썸네일 또는 짧은 증거와 함께 정리한다.

  AVOID
  완벽하게 동일한 카드, 길고 빽빽한 보고서 문단, 형광 글로우, 지나친 아이콘, 이미지 없는 추상 다이어그램.
