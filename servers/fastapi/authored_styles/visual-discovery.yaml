brief: |-
  MOOD
  관찰하고 연결하며 예상 밖의 패턴을 발견하는 호기심. 단정한 보고서보다 연구 벽면의 흥미로운 증거 묶음처럼 느껴져야 한다.

  Make visual exploration feel like a disciplined discovery notebook: each specimen should lead to a named observation, a comparison and a next question.

  PALETTE
  흐린 세이지 화이트 #F4F7F4와 짙은 남청 #182235를 기본으로 한다. 코발트 #2457D6는 연결과 주석, 앰버 #FFB21A는 발견의 순간, 연보라 #E7D8FF는 이미지 뒤의 부드러운 레이어에 사용한다.

  Preserve pale neutral green, cobalt, amber and lavender. Use ink for reading copy, blue for structural annotations and amber for one selected detail; pastel areas always receive dark labels.

  TYPOGRAPHY
  제목과 관찰 메모는 한글을 지원하는 선명한 산세리프를 사용한다. 한글 메모는 기울임보다 굵기와 간격으로 구별한다. 캡션은 이미지 옆의 독립된 읽기 영역에 두며 긴 인용과 참여자 표기는 의미 단위로 줄바꿈한다. 주석이 많으면 배치를 넓히고 런타임 글자 크기 하한을 유지한다.

  Use a lucid sans-serif hierarchy with clear specimen numbers and short reading measures. Captions should read as evidence notes rather than decorative stickers. All Korean text must resolve through a local stack including "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif. At a 1280x720 canvas, target body 22-28px and labels at least 16px; 9.5pt (12.667px) is the hard floor for every text run, including SVG, captions and sources. If text cannot fit, shorten with evidence intact or split the slide; never shrink below the floor.

  LAYOUT SYSTEM
  서로 다른 크기의 이미지·인용·관찰 카드를 비정형 콜라주로 배치하되 보이지 않는 기준선으로 읽는 순서를 지킨다. 중심 발견 하나와 소수의 주변 증거를 두고 필수 증거가 많으면 별도 정렬 영역으로 묶는다. 이미지 프레임만 겹치고 캡션·인용·출처는 겹치지 않게 한다. 외곽 안전 여백과 주석 연결 통로를 확보한다.

  Build a loose but aligned specimen field with an adjacent synthesis margin. Vary the rhythm between an image-led discovery spread, a two-specimen comparison and a quiet findings index. Keep three specimens or three observations per page; do not turn the notebook into a dense mood-board wall. These are flexible compositional directions for freely authored HTML/CSS, not fixed layouts, slots, Deck IR or a layout engine.

  SIGNATURE ELEMENTS
  파란 연결선, 원으로 둘러싼 발견, 앰버 밑줄, 작은 번호 주석, 종이 조각처럼 겹친 이미지 프레임을 사용한다. 다크 네온, 운영 대시보드, 규칙적인 카드 그리드는 사용하지 않는다.

  Use numbered locator dots, a small cobalt annotation bracket and one amber selection mark. Every connector should map an observation to the exact feature it discusses.

  DATA VISUALIZATION
  수치 좌표가 제공되면 주석이 달린 산점도를, 정성 분류이면 축의 기준을 명시한 매트릭스를 사용한다. 이미지 표본의 크기나 개수로 전체 모집단 비율을 암시하지 않는다. 단순 막대에는 단위·표본 수·기간·출처를 붙이고 관찰과 해석을 문구로 구별한다. 점선 경로는 발견 순서에만 사용하며 인과관계를 암시하지 않는다.

  Separate raw observation from interpretation and action. Use a compact coded-observation table, a plain distribution strip or aligned option comparison; state sample size and avoid implying statistical confidence from qualitative examples.

  IMAGE DIRECTION
  현장 사진, 제품 스크린샷, 자료의 세부 크롭, 물성 있는 사물, 다양한 관점을 보여 주는 연속 이미지를 사용한다. 사진은 완벽히 맞춘 스톡 컷보다 발견의 단서를 남긴다.

  Use original shape studies or supplied source-backed imagery with clear specimen captions. A simulated sample must be labeled illustrative; retain all references and never fabricate research photographs.

  SLIDE ARCHETYPES
  cover: 제목 옆에 발견을 암시하는 큰 이미지 크롭과 파란 주석 원 하나를 둔다.
  content: 중심 이미지 또는 인용을 두고 세 개 이하의 관찰 메모를 연결한다.
  section: 한 개의 이미지 조각과 파란 주석 원 옆에 새로운 탐색 질문을 둔다.
  agenda: 제공된 조사 주제를 크기가 다른 이미지 조각 옆의 정렬된 목록으로 소개한다.
  architecture: 관찰로 확인된 접점이나 관계를 이미지·라벨 노드로 묶고 파란 선을 빈 통로에 배치한다. 추정 관계는 점선과 가설 표기로 구분한다.
  data: 차트의 근거 있는 구간을 앰버로 표시하고 관찰과 해석을 가까이 배치한다.
  timeline: 제공된 발견 과정의 장면을 사진 조각과 번호 주석으로 연결하고 실제 날짜가 없으면 순서만 나타낸다.
  closing: 근거가 있는 핵심 발견을 이미지 썸네일 또는 짧은 증거와 함께 정리한다. 정해진 개수를 채우기 위해 발견을 만들지 않는다.

  Compose — three-specimen discovery field; paired feature comparison; one close-up with locator annotations; observation-to-hypothesis chain; coded evidence summary; divergent options with selection criteria; next research question.

  AVOID
  완벽하게 동일한 카드, 길고 빽빽한 보고서 문단, 형광 글로우, 지나친 아이콘, 이미지 없는 추상 다이어그램.

  Do not invent claims, measurements, quotations, citations or provenance. Keep illustrative data visibly labeled and supplied evidence traceable. Avoid repeating the same composition throughout a deck; alternate the narrative scenes above while retaining this style's visual identity. Keep all original reference images and their provenance intact.
