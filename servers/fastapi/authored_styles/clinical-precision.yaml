brief: >-
  MOOD: Design with clinical calm, precision, and patient-safety awareness. Every
  slide must support fast, accurate reading in a professional medical setting and
  clearly separate evidence, interpretation, and recommendation.

  PALETTE: Use sterile white-blue (#F8FBFC), deep clinical navy (#102A43), teal
  (#007C91), pale aqua panels (#CFE9ED), and safety red (#B42318) only for warnings,
  contraindications, or critical thresholds.
  Use the original palette with strong text/background contrast. Pale tints serve as surfaces, not low-contrast body text; differentiate critical states with wording or shape as well as color.

  TYPOGRAPHY: Use a highly legible sans-serif with generous line spacing, strong
  heading levels, and tabular numerals. Keep abbreviations expanded on first use and
  ensure tables, references, and labels remain readable from the back of a room.
  Use an available Hangul-capable font for Korean terms; allow phrase-based wrapping
  and enough row height for multi-line endpoint names. Keep dose units, inequality
  signs, subscripts, and superscripts intact. Reallocate space before shrinking text
  and preserve the runtime typography floor.
  At 1280x720, use the Korean-safe stack "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif for Korean text. Body text should normally be 22-28px; captions and source notes preferably at least 16px. The hard minimum for every visible text run is 9.5pt (12.667px). Recompose, shorten or split content before reducing readability; never shrink below this floor. Preserve any genre-specific display-face accents only where Korean fallback remains clear.

  LAYOUT SYSTEM: Use a disciplined grid with a prominent takeaway band, then evidence
  and details below. Limit each slide to one clinical question, and place population,
  endpoint, comparator, and evidence level in consistent locations when supplied.
  Do not assign an evidence grade or fill an absent denominator from assumptions.
  Keep a clear gutter between evidence and safety notes, a dedicated source band,
  and enough table-cell padding for bold labels without clipping.
  Use a calm clinical hierarchy: the question, the evidence population, the outcome and its limits. Give the primary endpoint or care-process comparison room to breathe and place safety context close to the result. Alternate eligibility, method, outcome and limitation views without forcing a dashboard on each. These are free compositional choices driven by content, never fixed layouts or required slots. Give the main evidence generous space and vary visual density across the deck.

  SIGNATURE ELEMENTS: Use evidence-grade chips, patient-pathway steps, dosage or
  protocol callout boxes, monitored parameter rows, and clearly bordered safety notes.
  Use teal for the focal endpoint and red only for a specifically labeled safety concern. Pair precise separators with generous white margins. Do not allow pictograms or color alone to communicate clinical meaning.

  DATA VISUALIZATION: Prefer forest plots, survival curves, treatment pathways,
  adverse-event tables, and carefully annotated outcomes charts. State denominator,
  timeframe, endpoint definition, confidence interval, and source; never imply
  causality beyond the evidence. Mark unavailable contextual fields as not reported
  where necessary instead of inventing them. Preserve forest-plot null lines and
  interval scales, survival time axes and censoring marks, and any supplied risk
  tables. Distinguish absolute from relative risk and do not mix endpoints or
  follow-up periods on an unlabeled shared scale.
  For clinical evidence, identify population, follow-up, denominator and endpoint definition when provided. Distinguish absolute from relative differences and efficacy from safety. Name uncertainty intervals and missing data; never invent treatment effects, clinical recommendations or patient records. Synthetic teaching data must be labeled clearly.

  IMAGE DIRECTION: Use ethically appropriate clinical environments, diagnostic imagery,
  or simplified anatomical illustrations only when they improve comprehension. Protect
  privacy and keep explanatory labels clear and non-obstructive.

  SLIDE ARCHETYPES: cover: clinical topic, population, and evidence date on a clean
  field; content: a question-to-evidence-to-implication sequence; data: one fully
  labeled outcome visual with a safety or limitation note; timeline: screening,
  intervention, follow-up, and assessment stages only where supported by the source;
  section: the next clinical question with a quiet teal rule; agenda: aligned
  clinical questions in the supplied order; architecture: a care pathway or study
  structure with explicit branch conditions, arrows through clear gutters, and
  long labels outside connectors; closing: practical takeaway,
  evidence limitation, and referral to full guidance.
  Additional forms: eligibility and follow-up sequence; endpoint comparison with denominators; outcome intervals with their definition; safety-event table separating count and rate; evidence summary with limitations and unresolved questions.

  AVOID: Avoid sensational red, unreadable dense tables, unlabeled medical imagery,
  unsupported treatment claims, patient-identifying details, decorative vital signs,
  and conclusions that omit safety, limitations, or evidence quality.
  Avoid benefit-only summaries, implied treatment guidance from sample data, red/green-only status coding and clinical certainty beyond the supplied evidence.
