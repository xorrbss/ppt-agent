[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "presenton-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.14.0",
    "aiohttp>=3.14.1,<4",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "dirtyjson>=1.0.8",
    "fastapi[standard]>=0.116.1",
    "fastapi-users[sqlalchemy]>=14.0.1",
    "fastembed-vectorstore>=0.5.2",
    "fastmcp>=2.11.0",
    "greenlet>=3.0.3",
    "google-genai>=1.28.0",
    "mem0ai[nlp]>=0.1.115",
    "nltk>=3.10.0,<4",
    "openai>=1.98.0",
    "pathvalidate>=3.3.1",
    "pdfplumber>=0.11.7",
    "psycopg[binary]>=3.2.0",
    "sqlmodel>=0.0.24",
    "llmai==0.2.5",
    "jsonschema>=4.26.0",
    "python-pptx>=1.0.2",
    "fonttools>=4.55.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"
constraint-dependencies = [
    "authlib>=1.7.1,<2",
    "click>=8.3.3,<9",
    "cryptography>=48.0.1,<49",
    "idna>=3.15,<4",
    "joserfc>=1.6.8,<2",
    "mako>=1.3.12,<2",
    "mcp>=1.28.1,<2",
    "pillow>=12.3.0,<13",
    "pyasn1>=0.6.4,<1",
    "pydantic-settings>=2.14.2,<3",
    "pyjwt>=2.13.0,<3",
    "python-multipart>=0.0.31,<0.1",
    "starlette>=1.3.1,<2",
    "urllib3>=2.7.0,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "enums*",
    "models*",
    "services*",
    "constants*",
    "utils*",
    "templates*",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Line coverage defaults (omit non-runtime / generated paths). Branch coverage doubles
# the work for marginal signal; optimize for deterministic statement coverage runs.
[tool.coverage.run]
branch = false
relative_files = true
source = ["."]
omit = [
    "tests/*",
    "**/.venv/*",
    "**/venv/*",
    "alembic/versions/*",
    "scripts/*",
]

[tool.coverage.report]
precision = 1
skip_empty = true
show_missing = true
